<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨匣 InkBox · 故事寫作工作室</title>
<meta name="description" content="仿 Scrivener 的瀏覽器故事寫作工具：文件夾結構、軟木板、大綱、快照、專注模式與輸出。">
<style>
:root{
  --bg:#f4f1ea;--panel:#ebe6dc;--panel2:#e2dccf;--line:#d3cbbb;--text:#2b2620;--muted:#7a7064;
  --accent:#9a5b2c;--accent2:#c27a40;--paper:#fffdf8;--sel:#d9cdb6;--cork:#b98f5f;--card:#fffef4;
  --shadow:0 1px 3px rgba(0,0,0,.18);--serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --bw:260px;--iw:290px;--font:19px;--width:720px;
}
[data-theme=sepia]{--bg:#efe4cf;--panel:#e6d8bd;--panel2:#dccbab;--line:#c9b48f;--text:#3b2f22;--muted:#7d6a52;--paper:#f8efdc;--sel:#d2bd96;--card:#fbf3e1}
[data-theme=dark]{--bg:#1c1e21;--panel:#24272b;--panel2:#2c2f34;--line:#3a3e45;--text:#e4e0d8;--muted:#9a958c;--accent:#e0a060;--accent2:#e8b47c;--paper:#26292d;--sel:#3c4048;--cork:#4b3f31;--card:#32353a;--shadow:0 1px 4px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;
  display:grid;grid-template-rows:46px 1fr 30px;grid-template-columns:var(--bw) 1fr var(--iw);
  grid-template-areas:"top top top" "binder main insp" "foot foot foot";overflow:hidden}
body.no-binder{--bw:0px} body.no-insp{--iw:0px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--panel2);border-color:var(--line)}
button.on{background:var(--sel);border-color:var(--accent)}
input,select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:5px 7px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}

/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .brand{font-family:var(--serif);font-weight:700;color:var(--accent);margin-right:4px;white-space:nowrap}
#projTitle{font-family:var(--serif);font-weight:600;background:transparent;border-color:transparent;width:180px}
#projTitle:hover{border-color:var(--line)}
#top .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#top .grow{flex:1}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}

/* binder */
#binder{grid-area:binder;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:0}
#binder .head{padding:8px;border-bottom:1px solid var(--line)}
#search{width:100%}
#tree{flex:1;overflow:auto;padding:6px 0;user-select:none}
.node{display:flex;align-items:center;gap:4px;padding:3px 8px;cursor:pointer;border-top:2px solid transparent;border-bottom:2px solid transparent;white-space:nowrap}
.node:hover{background:var(--panel2)}
.node.sel{background:var(--sel)}
.node .caret{width:14px;text-align:center;color:var(--muted);font-size:10px;flex:none}
.node .ico{flex:none;width:18px;text-align:center}
.node .ttl{overflow:hidden;text-overflow:ellipsis;flex:1}
.node .dot{width:8px;height:8px;border-radius:50%;flex:none}
.node .cnt{color:var(--muted);font-size:11px}
.node.root .ttl{font-weight:600}
.node.drop-before{border-top-color:var(--accent)}
.node.drop-after{border-bottom-color:var(--accent)}
.node.drop-inside{background:var(--sel);outline:1px dashed var(--accent)}
.node.excluded .ttl{opacity:.55}
#binder .foot{display:flex;gap:4px;padding:6px;border-top:1px solid var(--line)}
#binder .foot button{flex:1;padding:4px 2px;font-size:12px}
.result{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.result:hover{background:var(--panel2)}
.result small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
mark{background:#f3d27a;color:#2b2620;border-radius:2px}

/* main */
#main{grid-area:main;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#crumb{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted);min-height:38px}
#crumb .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumb .path b{color:var(--text)}
#view{flex:1;overflow:auto;position:relative}

/* editor */
.paper{max-width:var(--width);margin:28px auto 120px;background:var(--paper);box-shadow:var(--shadow);border-radius:3px;padding:44px 56px 60px;min-height:70vh}
.paper .dtitle{font-family:var(--serif);font-size:calc(var(--font) * 1.35);font-weight:700;border:none;background:transparent;width:100%;padding:0 0 10px;margin-bottom:14px;border-bottom:1px solid var(--line);border-radius:0}
.ed{width:100%;border:none;background:transparent;resize:none;font-family:var(--serif);font-size:var(--font);line-height:1.95;padding:0;overflow:hidden;min-height:50vh;letter-spacing:.02em}
.ed:focus{border:none}
.scriv{border-top:1px dashed var(--line);padding-top:16px;margin-top:18px}
.scriv:first-of-type{border-top:none;margin-top:0;padding-top:0}
.scriv .stitle{font-size:12px;color:var(--muted);margin-bottom:6px;cursor:pointer}
.scriv .stitle:hover{color:var(--accent)}
.scriv .ed{min-height:3em}
.folderhead{font-family:var(--serif);font-size:calc(var(--font) * 1.2);font-weight:700;margin:26px 0 6px;color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:80px 20px;line-height:2}

/* corkboard */
.cork{min-height:100%;padding:24px;background:var(--cork);
  background-image:radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);
  background-size:7px 7px,11px 11px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;align-content:start}
.card{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.28);border-radius:2px;height:160px;display:flex;flex-direction:column;position:relative;cursor:grab;
  background-image:repeating-linear-gradient(transparent 0 23px,rgba(120,150,200,.18) 23px 24px);background-position:0 34px}
.card.sel{outline:3px solid var(--accent)}
.card .bar{height:5px;flex:none}
.card .ct{font-weight:700;padding:6px 10px 4px;border-bottom:1px solid rgba(200,80,80,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif)}
.card textarea{flex:1;border:none;background:transparent;resize:none;padding:4px 10px;font-size:13px;line-height:24px;font-family:var(--serif)}
.card .stamp{position:absolute;right:8px;bottom:6px;font-size:11px;color:#c0392b;border:1.5px solid #c0392b;border-radius:3px;padding:0 4px;transform:rotate(-8deg);opacity:.8;background:var(--card)}
.card .kind{position:absolute;right:8px;top:9px;font-size:12px}
.card.drop-l{box-shadow:-5px 0 0 var(--accent),0 3px 8px rgba(0,0,0,.28)}
.card.drop-r{box-shadow:5px 0 0 var(--accent),0 3px 8px rgba(0,0,0,.28)}
.card.add{background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.6);box-shadow:none;align-items:center;justify-content:center;color:#fff;font-size:15px;cursor:pointer}

/* outliner */
.outline{width:100%;border-collapse:collapse;font-size:13px}
.outline th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600;z-index:1}
.outline td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.outline tr{cursor:pointer}
.outline tr:hover td{background:var(--panel)}
.outline tr.sel td{background:var(--sel)}
.outline .syn{color:var(--muted);max-width:380px}
.outline .num{text-align:right;font-variant-numeric:tabular-nums}
.outline tr.folder td:first-child{font-weight:600}

/* inspector */
#insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-width:0}
#insp .inner{padding:12px;display:flex;flex-direction:column;gap:12px}
#insp label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
#insp input:not([type=checkbox]),#insp select,#insp textarea{width:100%}
#insp textarea{resize:vertical;font-family:var(--serif);line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex!important;align-items:center;gap:6px;color:var(--text)!important;font-size:13px!important}
.meta{font-size:12px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);padding-top:8px}
.snap{display:flex;align-items:center;gap:4px;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.snap span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snap button{padding:1px 6px;font-size:11px}
.prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
h4{margin:0;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em}

/* footer */
#foot{grid-area:foot;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
#foot .mini{display:inline-block;width:70px;height:5px;background:var(--panel2);border-radius:3px;vertical-align:middle;margin-left:4px;overflow:hidden}
#foot .mini i{display:block;height:100%;background:var(--accent)}
#saved{margin-left:auto}

/* composition mode */
#comp{position:fixed;inset:0;background:#141517;z-index:50;display:none;flex-direction:column;align-items:center}
#comp.show{display:flex}
#comp .wrap{flex:1;overflow:auto;width:100%;display:flex;justify-content:center}
#comp textarea{width:min(var(--width),92vw);background:transparent;border:none;color:#d8d4cb;font-family:var(--serif);font-size:calc(var(--font) + 1px);line-height:2.05;resize:none;padding:16vh 0 50vh;outline:none;min-height:100%}
#comp .cbar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:12px;align-items:center;justify-content:center;padding:10px;color:#888;font-size:13px;opacity:0;transition:opacity .3s;background:linear-gradient(transparent,#141517 40%)}
#comp .cbar:hover,#comp.idle-no .cbar{opacity:1}
#comp .cbar button{background:#2a2c30;border-color:#3a3d42;color:#ccc}

/* modal, menu, toast */
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60}
#modalBg.show{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.35);width:min(560px,94vw);max-height:88vh;display:flex;flex-direction:column}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--serif)}
.modal .mb{padding:16px 18px;overflow:auto;line-height:1.7}
.modal .mb .field{margin-bottom:12px}
.modal .mb label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal pre{white-space:pre-wrap;font-family:var(--serif);background:var(--paper);padding:12px;border-radius:6px;max-height:50vh;overflow:auto;margin:0}
#menu{position:fixed;z-index:70;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:4px;display:none;min-width:170px}
#menu div{padding:6px 12px;border-radius:5px;cursor:pointer}
#menu div:hover{background:var(--sel)}
#menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:80}
#toast.show{opacity:.92}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}

@media (max-width:900px){
  body{--iw:0px} body.show-insp{--iw:0px}
  body.show-insp #insp{position:fixed;right:0;top:46px;bottom:30px;width:290px;z-index:40;box-shadow:-4px 0 16px rgba(0,0,0,.2)}
  #projTitle{width:110px}
  .hide-sm{display:none}
  .paper{padding:28px 22px 40px;margin:12px 8px 80px}
}
@media (max-width:640px){
  body{--bw:0px}
  body.show-binder #binder{position:fixed;left:0;top:46px;bottom:30px;width:260px;z-index:40;box-shadow:4px 0 16px rgba(0,0,0,.2)}
  #top .brand{display:none}
}
@media print{body{display:block;overflow:visible}#top,#binder,#insp,#foot,#crumb{display:none}.paper{box-shadow:none;margin:0;max-width:none}}
</style>
</head>
<body>

<header id="top">
  <button class="ghost" id="btnBinder" title="切換文件夾面板">☰</button>
  <span class="brand">墨匣</span>
  <input id="projTitle" title="專案名稱">
  <span class="sep"></span>
  <div class="seg" id="viewSeg">
    <button data-view="editor" title="編輯 (Ctrl+1)">✎ 編輯</button>
    <button data-view="cork" title="軟木板 (Ctrl+2)">▦ 軟木板</button>
    <button data-view="outline" title="大綱 (Ctrl+3)">☷ 大綱</button>
  </div>
  <span class="grow"></span>
  <button class="ghost" id="btnComp" title="專注寫作模式 (F9)">◐ 專注</button>
  <button class="ghost hide-sm" id="btnTargets" title="字數目標">◎ 目標</button>
  <button class="ghost" id="btnCompile" title="輸出成稿">⇪ 輸出</button>
  <button class="ghost" id="btnFile" title="專案檔案">⋯ 專案</button>
  <button class="ghost" id="btnTheme" title="切換主題">☀</button>
  <button class="ghost" id="btnInsp" title="切換檢視器">ⓘ</button>
</header>

<aside id="binder">
  <div class="head"><input id="search" placeholder="🔍 搜尋全專案…"></div>
  <div id="tree"></div>
  <div class="foot">
    <button id="addDoc" title="新增文件">＋ 文件</button>
    <button id="addFolder" title="新增資料夾">＋ 資料夾</button>
    <button id="delItem" title="移至垃圾桶">🗑</button>
  </div>
</aside>

<main id="main">
  <div id="crumb"><span class="path" id="path"></span>
    <span id="edTools">
      <button class="ghost" id="fontDown" title="縮小字體">A−</button>
      <button class="ghost" id="fontUp" title="放大字體">A＋</button>
      <button class="ghost" id="widthBtn" title="版面寬度">↔</button>
    </span>
  </div>
  <div id="view"></div>
</main>

<aside id="insp"></aside>

<footer id="foot">
  <span id="fDoc"></span>
  <span id="fSel"></span>
  <span id="fSess"></span>
  <span id="fProj"></span>
  <span id="saved">●  已儲存</span>
</footer>

<div id="comp">
  <div class="wrap"><textarea id="compText" spellcheck="false"></textarea></div>
  <div class="cbar"><span id="compInfo"></span><button id="compExit">離開 (Esc)</button></div>
</div>
<div id="modalBg"><div class="modal"><h3 id="mTitle"></h3><div class="mb" id="mBody"></div><div class="mf" id="mFoot"></div></div></div>
<div id="menu"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* ========== 常數與狀態 ========== */
const KEY='inkbox-project-v1', PREFKEY='inkbox-prefs-v1';
const LABELS=[
  {id:'',name:'（無）',color:'transparent'},
  {id:'main',name:'主線',color:'#d9534f'},
  {id:'sub',name:'支線',color:'#4a8fd6'},
  {id:'char',name:'角色',color:'#4fae63'},
  {id:'foreshadow',name:'伏筆',color:'#b67bd1'},
  {id:'idea',name:'靈感',color:'#e3a33a'},
  {id:'check',name:'待查證',color:'#7f8c8d'}
];
const STATUS=['','待寫','初稿','修訂中','定稿','完成'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const fmtDate=t=>{const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const labelOf=id=>LABELS.find(l=>l.id===id)||LABELS[0];

let P=null;
let prefs={theme:'light',font:19,width:720,binder:true,insp:true};
const S={sel:null,insp:null,view:'editor',expanded:{},search:'',drag:null,cardDrag:null};

/* ========== 字數計算（中日韓字元逐字計，英文逐詞計） ========== */
const CJK=/[㐀-䶿一-鿿豈-﫿぀-ヿ가-힯]/g;
function wc(t){if(!t)return 0;const c=(t.match(CJK)||[]).length;const w=(t.replace(CJK,' ').match(/[A-Za-z0-9À-ɏ'’-]+/g)||[]).length;return c+w}
function totalWords(id,onlyCompile){const it=item(id);if(!it||(onlyCompile&&!it.compile))return 0;return wc(it.content)+it.children.reduce((s,c)=>s+totalWords(c,onlyCompile),0)}

/* ========== 資料模型 ========== */
function mk(type,title,extra){return Object.assign({id:uid(),type,title,content:'',synopsis:'',notes:'',label:'',status:'',compile:true,target:0,children:[],snapshots:[],created:Date.now(),modified:Date.now()},extra||{})}
function baseProject(title){
  const p={title:title||'未命名專案',items:{},roots:[],targets:{project:80000,session:1000},app:'inkbox',version:1};
  const add=it=>(p.items[it.id]=it);
  const d=add(mk('folder','草稿',{special:'draft'}));
  const r=add(mk('folder','研究資料',{special:'research',compile:false}));
  const t=add(mk('folder','垃圾桶',{special:'trash',compile:false}));
  p.roots=[d.id,r.id,t.id];
  return {p,add,d,r,t};
}
const CHAR_TEMPLATE=`姓名：
年齡／身分：
外貌特徵：

性格：
口頭禪／說話方式：

想要什麼（外在目標）：
需要什麼（內在需求）：
恐懼與弱點：
秘密：

人物弧線（開始 → 結束）：

與其他角色的關係：
`;
const PLACE_TEMPLATE=`地點名稱：
位置：
氣味、聲音、光線：
歷史與傳聞：
在故事中的作用：
`;
function sampleProject(){
  const {p,add,d,r}=baseProject('霧港奇譚');
  const ch1=add(mk('folder','第一章　雨夜來客',{synopsis:'沈硯抵達霧港，在旅店遇見神秘的寄信人。',label:'main'}));
  const ch2=add(mk('folder','第二章　燈塔的鑰匙',{synopsis:'線索指向廢棄燈塔。'}));
  d.children.push(ch1.id,ch2.id);
  const s1=add(mk('doc','抵達霧港',{label:'main',status:'初稿',synopsis:'渡輪靠岸，霧氣吞沒碼頭；沈硯發現行李裡多了一封沒有署名的信。',
    content:`渡輪靠岸的時候，霧已經濃得看不見對岸的燈。

沈硯提著皮箱走下跳板，鞋底踩在濕滑的木板上，發出一聲悶響。碼頭上只有一個收票的老人，縮在油布雨衣裡，像一團被雨打濕的影子。

「最後一班了，」老人說，「這幾天，不會再有船來。」

他點點頭，沒有多問。直到走進旅店，打開皮箱，他才發現夾層裡多了一封信——牛皮紙信封，沒有郵戳，也沒有署名，只用鉛筆寫著三個字：

燈塔見。`}));

function item(id){return P.items[id]}
function parentOf(id){for(const k in P.items){if(P.items[k].children.includes(id))return k}return null}
function rootOf(id){let c=id,p;while((p=parentOf(c)))c=p;return c}
function inTrash(id){return item(rootOf(id))?.special==='trash'}
function isAncestor(a,b){let p=parentOf(b);while(p){if(p===a)return true;p=parentOf(p)}return false}
function pathOf(id){const out=[];let c=id;while(c){out.unshift(c);c=parentOf(c)}return out}
function touch(it){if(it)it.modified=Date.now();save()}
function descendants(id,depth=0,out=[]){item(id).children.forEach(c=>{out.push({id:c,depth});descendants(c,depth+1,out)});return out}
function detach(id){const p=parentOf(id);if(p){const a=item(p).children;a.splice(a.indexOf(id),1)}}

/* ========== 儲存 ========== */
let saveTimer=null;
function save(){$('#saved').textContent='○ 儲存中…';clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500)}
function saveNow(){
  clearTimeout(saveTimer);
  try{localStorage.setItem(KEY,JSON.stringify(P));$('#saved').textContent='● 已儲存 '+fmtDate(Date.now()).split(' ')[1]}
  catch(e){$('#saved').textContent='⚠ 儲存失敗';toast('瀏覽器儲存空間不足，請匯出專案檔備份！')}
}
function savePrefs(){try{localStorage.setItem(PREFKEY,JSON.stringify(prefs))}catch(e){}}
function load(){
  try{P=JSON.parse(localStorage.getItem(KEY))}catch(e){P=null}
  if(!P||!P.items||!P.roots)P=sampleProject();
  try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREFKEY))||{})}catch(e){}
  S.sel=P.firstSel&&item(P.firstSel)?P.firstSel:(P.lastSel&&item(P.lastSel)?P.lastSel:P.roots[0]);
  S.insp=S.sel;
  S.expanded=P.expanded||{};
  if(!sessionStorage.getItem('inkbox-session-start'))sessionStorage.setItem('inkbox-session-start',totalWords(P.roots[0],false));
}

/* ========== 套用偏好 ========== */
function applyPrefs(){
  document.documentElement.dataset.theme=prefs.theme;
  document.documentElement.style.setProperty('--font',prefs.font+'px');
  document.documentElement.style.setProperty('--width',prefs.width+'px');
  document.body.classList.toggle('no-binder',!prefs.binder);
  document.body.classList.toggle('no-insp',!prefs.insp);
  $('#btnTheme').textContent={light:'☀',sepia:'☕',dark:'☾'}[prefs.theme];
}

/* ========== 選取 ========== */
function select(id,keepView){
  if(!item(id))return;
  S.sel=id;S.insp=id;P.lastSel=id;
  pathOf(id).slice(0,-1).forEach(a=>S.expanded[a]=true);
  P.expanded=S.expanded;
  if(!keepView&&item(id).type==='folder'&&S.view==='editor'&&!descendants(id).some(d=>item(d.id).type==='doc'))S.view='cork';
  renderAll();save();
}
function setInsp(id){S.insp=id;renderInspector();renderFooter();highlightInMain()}

/* ========== 文件夾面板 ========== */
function renderBinder(){
  const tree=$('#tree');tree.innerHTML='';
  if(S.search.trim()){renderSearch(tree);return}
  P.roots.forEach(r=>tree.appendChild(nodeEl(r,0)));
}
function iconFor(it){
  if(it.special==='draft')return '📕';
  if(it.special==='research')return '📚';
  if(it.special==='trash')return it.children.length?'🗑️':'🗑';
  if(it.type==='folder')return S.expanded[it.id]===false?'📁':'📂';
  return it.children.length?'📑':(it.content.trim()?'📄':'🗋');
}
function nodeEl(id,depth){
  const it=item(id),wrap=document.createElement('div');
  const row=document.createElement('div');
  const has=it.children.length>0,open=S.expanded[id]!==false;
  row.className='node'+(S.sel===id?' sel':'')+(it.special?' root':'')+(!it.compile&&!it.special&&rootOf(id)===P.roots[0]?' excluded':'');
  row.style.paddingLeft=(6+depth*15)+'px';
  row.dataset.id=id;row.draggable=!it.special;
  const lc=labelOf(it.label).color;
  row.innerHTML=`<span class="caret">${has?(open?'▼':'▶'):''}</span><span class="ico">${iconFor(it)}</span><span class="ttl">${esc(it.title||'未命名')}</span>${it.label?`<span class="dot" style="background:${lc}"></span>`:''}`;
  row.querySelector('.caret').onclick=e=>{e.stopPropagation();if(has){S.expanded[id]=!open;P.expanded=S.expanded;renderBinder();save()}};
  row.onclick=()=>select(id);
  row.ondblclick=e=>{if(!e.target.classList.contains('caret')&&it.special!=='trash')renameInline(row,id)};
  row.oncontextmenu=e=>{e.preventDefault();select(id);showMenu(e.clientX,e.clientY,id)};
  row.ondragstart=e=>{S.drag=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id)};
  row.ondragend=()=>{S.drag=null;clearDrop()};
  row.ondragover=e=>{
    if(!S.drag||S.drag===id||isAncestor(S.drag,id))return;
    e.preventDefault();clearDrop();
    const r=row.getBoundingClientRect(),y=(e.clientY-r.top)/r.height;
    const zone=it.special?'inside':(y<.28?'before':y>.72?'after':'inside');
    row.classList.add('drop-'+zone);row.dataset.zone=zone;
  };
  row.ondragleave=()=>row.classList.remove('drop-before','drop-after','drop-inside');
  row.ondrop=e=>{e.preventDefault();const z=row.dataset.zone;clearDrop();if(S.drag&&z)moveItem(S.drag,id,z)};
  wrap.appendChild(row);
  if(has&&open)it.children.forEach(c=>wrap.appendChild(nodeEl(c,depth+1)));
  return wrap;
}
function clearDrop(){document.querySelectorAll('.drop-before,.drop-after,.drop-inside').forEach(n=>n.classList.remove('drop-before','drop-after','drop-inside'))}
function moveItem(id,target,zone){
  if(id===target||isAncestor(id,target)||item(id).special)return;
  detach(id);
  if(zone==='inside'){item(target).children.push(id);S.expanded[target]=true}
  else{const p=parentOf(target);const a=item(p).children;let i=a.indexOf(target);if(zone==='after')i++;a.splice(i,0,id)}
  touch(item(id));renderAll();
}
function renameInline(row,id){
  const it=item(id),span=row.querySelector('.ttl');
  const inp=document.createElement('input');inp.value=it.title;inp.style.cssText='flex:1;padding:1px 4px;min-width:0';
  span.replaceWith(inp);inp.focus();inp.select();row.draggable=false;
  let done=false;
  const commit=ok=>{if(done)return;done=true;if(ok&&inp.value.trim()){it.title=inp.value.trim();touch(it)}renderAll()};
  inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')commit(true);if(e.key==='Escape')commit(false)};
  inp.onblur=()=>commit(true);inp.onclick=e=>e.stopPropagation();
}
function renderSearch(tree){
  const q=S.search.trim().toLowerCase();const hits=[];
  for(const id in P.items){const it=P.items[id];if(it.special)continue;
    const fields=[it.title,it.content,it.synopsis,it.notes];
    const f=fields.find(x=>x&&x.toLowerCase().includes(q));
    if(f!==undefined){const i=f.toLowerCase().indexOf(q);hits.push({id,snip:f.slice(Math.max(0,i-12),i+q.length+28)})}}
  if(!hits.length){tree.innerHTML='<div class="empty" style="padding:30px 10px">找不到「'+esc(S.search)+'」</div>';return}
  const re=new RegExp(S.search.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  hits.forEach(h=>{const d=document.createElement('div');d.className='result';
    d.innerHTML=`${iconFor(item(h.id))} ${esc(item(h.id).title)}<small>${esc(h.snip).replace(re,m=>'<mark>'+m+'</mark>')}</small>`;
    d.onclick=()=>{S.view=item(h.id).type==='doc'?'editor':S.view;select(h.id,true)};tree.appendChild(d)});
}

/* ========== 新增／刪除／複製 ========== */
function addItem(type,where,opts){
  const base=where||S.sel||P.roots[0];const b=item(base);
  const it=mk(type,opts?.title||(type==='folder'?'新資料夾':'新文件'),opts?.extra);
  if(inTrash(base)){P.items[it.id]=it;item(P.roots[0]).children.push(it.id)}
  else{
    P.items[it.id]=it;
    if(b.type==='folder'||b.special){b.children.push(it.id);S.expanded[base]=true}
    else{const p=parentOf(base);const a=item(p).children;a.splice(a.indexOf(base)+1,0,it.id)}
  }
  if(rootOf(it.id)===P.roots[1])it.compile=false;
  touch(it);
  if(opts?.stay){renderAll();return it}
  if(type==='doc')S.view='editor';
  select(it.id,true);
  setTimeout(()=>{const r=document.querySelector(`.node[data-id="${it.id}"]`);if(r)renameInline(r,it.id)},30);
  return it;
}
function removeAll(id){const it=item(id);it.children.forEach(removeAll);delete P.items[id]}
function trashItem(id){
  id=id||S.sel;const it=item(id);if(!it||it.special)return toast('這個資料夾無法刪除');
  const trash=P.roots[2];
  if(inTrash(id)){
    confirmBox('永久刪除',`確定永久刪除「${esc(it.title)}」及其所有內容？此動作無法復原。`,()=>{detach(id);removeAll(id);select(trash)});
    return;
  }
  const p=parentOf(id);detach(id);item(trash).children.push(id);touch(it);toast(`已移至垃圾桶：${it.title}`);select(p);
}
function emptyTrash(){
  const t=item(P.roots[2]);if(!t.children.length)return toast('垃圾桶是空的');
  confirmBox('清空垃圾桶',`將永久刪除 ${t.children.length} 個項目，確定嗎？`,()=>{t.children.slice().forEach(c=>{detach(c);removeAll(c)});touch();select(t.id)});
}
function cloneDeep(id){const o=item(id);const c=JSON.parse(JSON.stringify(o));c.id=uid();c.created=c.modified=Date.now();c.children=o.children.map(cloneDeep);P.items[c.id]=c;return c.id}
function duplicate(id){const it=item(id);if(it.special)return;const nid=cloneDeep(id);item(nid).title=it.title+'（副本）';const a=item(parentOf(id)).children;a.splice(a.indexOf(id)+1,0,nid);touch(item(nid));select(nid,true)}

/* ========== 右鍵選單 ========== */
function showMenu(x,y,id){
  const it=item(id),m=$('#menu');const opts=[];
  if(it.special==='trash'){opts.push(['清空垃圾桶',emptyTrash])}
  else{
    opts.push(['＋ 新增文件',()=>addItem('doc',id)],['＋ 新增資料夾',()=>addItem('folder',id)],
      ['＋ 角色卡（範本）',()=>addItem('doc',id,{title:'新角色',extra:{content:CHAR_TEMPLATE,label:'char'}})],
      ['＋ 地點卡（範本）',()=>addItem('doc',id,{title:'新地點',extra:{content:PLACE_TEMPLATE}})],'-');
    if(!it.special)opts.push(['重新命名',()=>{const r=document.querySelector(`.node[data-id="${id}"]`);r&&renameInline(r,id)}],['複製',()=>duplicate(id)],
      [it.compile?'從輸出排除':'納入輸出',()=>{it.compile=!it.compile;touch(it);renderAll()}],
      ['拍攝快照',()=>takeSnapshot(id)],'-',[inTrash(id)?'永久刪除':'移至垃圾桶',()=>trashItem(id)]);
    if(it.children.length)opts.push('-',['全部展開',()=>{[id,...descendants(id).map(d=>d.id)].forEach(i=>S.expanded[i]=true);renderBinder()}],['全部收合',()=>{[id,...descendants(id).map(d=>d.id)].forEach(i=>S.expanded[i]=false);renderBinder()}]);
  }
  m.innerHTML='';
  opts.forEach(o=>{if(o==='-'){m.appendChild(document.createElement('hr'));return}const d=document.createElement('div');d.textContent=o[0];d.onclick=()=>{hideMenu();o[1]()};m.appendChild(d)});
  m.style.display='block';
  const r=m.getBoundingClientRect();
  m.style.left=Math.min(x,innerWidth-r.width-6)+'px';m.style.top=Math.min(y,innerHeight-r.height-6)+'px';
}
function hideMenu(){$('#menu').style.display='none'}
document.addEventListener('click',e=>{if(!$('#menu').contains(e.target))hideMenu()});

/* ========== 主畫面 ========== */
function renderMain(){
  const it=item(S.sel);
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
  $('#path').innerHTML=pathOf(S.sel).map((p,i,a)=>i===a.length-1?`<b>${esc(item(p).title)}</b>`:esc(item(p).title)).join(' › ');
  $('#edTools').style.display=S.view==='editor'?'':'none';

function autosize(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
function bindEditor(t,id){
  t.value=item(id).content;
  t.addEventListener('input',()=>{const x=item(id);x.content=t.value;x.modified=Date.now();autosize(t);save();renderFooter();updateInspStats()});
  t.addEventListener('focus',()=>{if(S.insp!==id)setInsp(id)});
  t.spellcheck=false;
  requestAnimationFrame(()=>autosize(t));
}
function renderEditor(v,it){
  const paper=document.createElement('div');paper.className='paper';v.appendChild(paper);
  if(it.type==='doc'){
    const ti=document.createElement('input');ti.className='dtitle';ti.value=it.title;ti.placeholder='標題';
    ti.oninput=()=>{it.title=ti.value;touch(it);renderBinder();$('#path b')&&($('#path b').textContent=ti.value);const f=$('#iTitle');if(f)f.value=ti.value};
    paper.appendChild(ti);
    const t=document.createElement('textarea');t.className='ed';t.placeholder='開始寫作……';paper.appendChild(t);bindEditor(t,it.id);
    if(it.children.length){const n=document.createElement('div');n.className='empty';n.style.padding='20px';n.innerHTML=`此文件底下還有 ${it.children.length} 個子文件，可切換至「軟木板」檢視。`;paper.appendChild(n)}
    setTimeout(()=>{if(!it.content)t.focus()},50);
    return;
  }
  // 資料夾：連續編輯（Scrivenings）
  const list=descendants(it.id);
  if(!list.some(d=>item(d.id).type==='doc')){paper.innerHTML=`<div class="empty">「${esc(it.title)}」裡還沒有文件。<br><button class="primary" id="emptyAdd">＋ 新增第一個文件</button></div>`;$('#emptyAdd').onclick=()=>addItem('doc',it.id);return}
  const h=document.createElement('div');h.className='folderhead';h.style.marginTop='0';h.textContent=it.title;paper.appendChild(h);
  list.forEach(({id})=>{const x=item(id);
    if(x.type==='folder'){const fh=document.createElement('div');fh.className='folderhead';fh.textContent=x.title;paper.appendChild(fh);return}
    const box=document.createElement('div');box.className='scriv';box.dataset.id=id;
    box.innerHTML=`<div class="stitle" title="單獨開啟">${iconFor(x)} ${esc(x.title)}${x.compile?'':'（不輸出）'}</div>`;
    box.querySelector('.stitle').onclick=()=>select(id);
    const t=document.createElement('textarea');t.className='ed';t.placeholder='（空白場景）';box.appendChild(t);paper.appendChild(box);bindEditor(t,id);
  });
}
function corkContainer(it){return it.type==='folder'||it.children.length?it.id:parentOf(it.id)}

    card.ondragleave=()=>card.classList.remove('drop-l','drop-r');
    card.ondrop=e=>{e.preventDefault();const z=card.dataset.zone;if(S.cardDrag&&z){const d=S.cardDrag;S.cardDrag=null;moveItem(d,id,z)}};

function renderOutline(v,it){
  const cid=corkContainer(it);const rows=descendants(cid);

  const ti=$('#iTitle');ti.value=it.title;ti.oninput=()=>{it.title=ti.value;touch(it);renderBinder();const d=document.querySelector('.paper .dtitle');if(d&&S.sel===id)d.value=ti.value};
  const sy=$('#iSyn');sy.value=it.synopsis;sy.oninput=()=>{it.synopsis=sy.value;touch(it);const c=document.querySelector(`.card[data-id="${id}"] textarea`);if(c)c.value=sy.value};
  const lb=$('#iLabel');lb.value=it.label;lb.onchange=()=>{it.label=lb.value;touch(it);renderBinder();if(S.view!=='editor')renderMain()};
  const st=$('#iStatus');st.value=it.status;st.onchange=()=>{it.status=st.value;touch(it);if(S.view!=='editor')renderMain()};

  const no=$('#iNotes');no.value=it.notes;no.oninput=()=>{it.notes=no.value;touch(it)};
  if(isDoc){

    $('#iSnap').onclick=()=>takeSnapshot(id);
    const sl=$('#iSnaps');
    if(!it.snapshots.length)sl.innerHTML='<div style="font-size:12px;color:var(--muted)">尚無快照。大幅修改前先拍一張吧！</div>';
    it.snapshots.slice().reverse().forEach(s=>{const r=document.createElement('div');r.className='snap';
      r.innerHTML=`<span title="${esc(s.name)}">${esc(s.name||fmtDate(s.t))}<br><small style="color:var(--muted)">${fmtDate(s.t)}・${wc(s.content)} 字</small></span><button data-a="v">檢視</button><button data-a="r">還原</button><button data-a="d">✕</button>`;

function updateInspStats(){
  const id=S.insp||S.sel,it=item(id),m=$('#iMeta');if(!it||!m)return;
  const w=it.type==='doc'?wc(it.content):totalWords(id);

/* ========== 快照 ========== */
function takeSnapshot(id,name){
  const it=item(id);if(it.type!=='doc')return toast('只有文件可以拍攝快照');
  const doIt=n=>{it.snapshots.push({t:Date.now(),name:n||'',content:it.content,title:it.title});touch(it);if((S.insp||S.sel)===id)renderInspector();toast('📷 已建立快照')};
  if(name!==undefined)return doIt(name);
  promptBox('拍攝快照','快照名稱（可留空）','',doIt);
}
function viewSnapshot(id,s){
  const cur=item(id).content;
  modal(`快照：${s.name||fmtDate(s.t)}`,`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">${fmtDate(s.t)}・${wc(s.content)} 字（目前 ${wc(cur)} 字）</div><pre>${esc(s.content)||'（空白）'}</pre>`,
    [['關閉'],['複製文字',()=>{navigator.clipboard?.writeText(s.content);toast('已複製')}],['還原此版本',()=>restoreSnapshot(id,s,true),'primary']]);
}
function restoreSnapshot(id,s,skipConfirm){
  const go=()=>{const it=item(id);it.snapshots.push({t:Date.now(),name:'還原前自動備份',content:it.content,title:it.title});it.content=s.content;touch(it);renderAll();toast('已還原（還原前的內容已自動存成快照）')};
  if(skipConfirm)return go();
  confirmBox('還原快照','用這個快照取代目前內容？目前的內容會自動另存成快照。',go);
}

/* ========== 輸出成稿 ========== */
function compileProject(opt){
  const blocks=[];
  function walk(id,depth){const it=item(id);if(!it.compile)return;
    if(it.type==='folder'){if(opt.chapters)blocks.push({k:'h',d:depth,t:it.title});let prevDoc=false;
      it.children.forEach(c=>{const x=item(c);if(!x.compile)return;if(x.type==='doc'&&prevDoc&&opt.sep&&!opt.scenes)blocks.push({k:'sep'});walk(c,depth+1);prevDoc=x.type==='doc'})}
    else{if(opt.scenes)blocks.push({k:'h',d:depth,t:it.title});if(opt.synopsis&&it.synopsis)blocks.push({k:'syn',t:it.synopsis});if(it.content.trim())blocks.push({k:'p',t:it.content.trim()});it.children.forEach(c=>walk(c,depth+1))}
  }
  let prevDoc=false;
  item(P.roots[0]).children.forEach(c=>{const x=item(c);if(!x.compile)return;if(x.type==='doc'&&prevDoc&&opt.sep&&!opt.scenes)blocks.push({k:'sep'});walk(c,1);prevDoc=x.type==='doc'});
  const title=P.title,author=opt.author;
  if(opt.fmt==='txt'){
    let s=title+'\n'+(author?author+'\n':'')+'\n\n';
    blocks.forEach(b=>{if(b.k==='h')s+=(b.d===1?'\n\n':'\n')+b.t+'\n\n';else if(b.k==='sep')s+='\n＊　＊　＊\n\n';else if(b.k==='syn')s+='〔'+b.t+'〕\n\n';else s+=b.t.split(/\n+/).map(l=>opt.indent?'　　'+l.trim():l).join('\n\n')+'\n\n'});
    return s.replace(/\n{4,}/g,'\n\n\n');
  }
  if(opt.fmt==='md'){
    let s='# '+title+'\n\n'+(author?'*'+author+'*\n\n':'');
    blocks.forEach(b=>{if(b.k==='h')s+='#'.repeat(Math.min(6,b.d+1))+' '+b.t+'\n\n';else if(b.k==='sep')s+='* * *\n\n';else if(b.k==='syn')s+='> '+b.t.replace(/\n/g,'\n> ')+'\n\n';else s+=b.t.split(/\n+/).join('\n\n')+'\n\n'});
    return s;
  }
  let body=blocks.map(b=>{if(b.k==='h')return `<h${Math.min(6,b.d+1)}>${esc(b.t)}</h${Math.min(6,b.d+1)}>`;if(b.k==='sep')return '<p class="sep">＊　＊　＊</p>';if(b.k==='syn')return `<blockquote>${esc(b.t)}</blockquote>`;return b.t.split(/\n+/).map(l=>`<p>${esc(l.trim())}</p>`).join('\n')}).join('\n');
  return `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>${esc(title)}</title><style>
body{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;max-width:680px;margin:60px auto;padding:0 24px;line-height:2;font-size:18px;color:#222}
h1{text-align:center;font-size:2em;margin-bottom:.2em}.author{text-align:center;color:#666;margin-bottom:4em}
h2{margin-top:3em;page-break-before:always;text-align:center}h3{margin-top:2em}p{margin:0 0 .6em;${opt.indent?'text-indent:2em;':''}}
.sep{text-align:center;text-indent:0;margin:1.5em 0;color:#888}blockquote{color:#777;border-left:3px solid #ccc;margin:1em 0;padding-left:1em;font-size:.9em}
@media print{body{margin:0 auto}h2:first-of-type{page-break-before:avoid}}</style></head><body>
<h1>${esc(title)}</h1>${author?`<div class="author">${esc(author)}</div>`:''}
${body}</body></html>`;
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function safeName(s){return (s||'project').replace(/[\\/:*?"<>|]/g,'_')}
function openCompile(){
  const o=P.compileOpt||{fmt:'txt',chapters:true,scenes:false,sep:true,synopsis:false,indent:true,author:''};
  modal('輸出成稿',`
    <div class="field"><label>格式</label><select id="cFmt"><option value="txt">純文字 (.txt)</option><option value="md">Markdown (.md)</option><option value="html">網頁 (.html)</option><option value="print">列印／另存 PDF</option></select></div>
    <div class="field"><label>作者署名</label><input id="cAuthor" style="width:100%" placeholder="（可留空）"></div>
    <label class="chk"><input type="checkbox" id="cCh"> 資料夾標題當作章節標題</label>
    <label class="chk"><input type="checkbox" id="cSc"> 顯示每個場景的標題</label>
    <label class="chk"><input type="checkbox" id="cSep"> 場景之間加分隔符（＊　＊　＊）</label>
    <label class="chk"><input type="checkbox" id="cIn"> 段首空兩格</label>
    <label class="chk"><input type="checkbox" id="cSyn"> 附上概要（適合交給編輯看大綱）</label>
    <p style="font-size:12px;color:var(--muted);margin:12px 0 0">只會輸出「草稿」資料夾內、勾選「納入輸出」的項目。目前約 ${totalWords(P.roots[0],true).toLocaleString()} 字。</p>`,
    [['取消'],['預覽',()=>{const opt=readOpt();const txt=compileProject({...opt,fmt:'txt'});modal('預覽',`<pre>${esc(txt)}</pre>`,[['關閉']]);return false}],['輸出',()=>{
      const opt=readOpt();P.compileOpt=opt;save();
      if(opt.fmt==='print'){const html=compileProject({...opt,fmt:'html'});const w=window.open(URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})));if(!w)toast('請允許彈出視窗');else w.addEventListener('load',()=>setTimeout(()=>w.print(),300));return}
      const ext={txt:'txt',md:'md',html:'html'}[opt.fmt];download(safeName(P.title)+'.'+ext,compileProject(opt),{txt:'text/plain',md:'text/markdown',html:'text/html'}[opt.fmt]);toast('已輸出 '+ext.toUpperCase());
    },'primary']]);
  $('#cFmt').value=o.fmt;$('#cAuthor').value=o.author||'';$('#cCh').checked=o.chapters;$('#cSc').checked=o.scenes;$('#cSep').checked=o.sep;$('#cIn').checked=o.indent;$('#cSyn').checked=o.synopsis;
  function readOpt(){return{fmt:$('#cFmt').value,author:$('#cAuthor').value.trim(),chapters:$('#cCh').checked,scenes:$('#cSc').checked,sep:$('#cSep').checked,indent:$('#cIn').checked,synopsis:$('#cSyn').checked}}
}

    catch(err){toast('檔案格式不正確')}};

/* ========== 對話框工具 ========== */
function modal(title,html,buttons){
  $('#mTitle').textContent=title;$('#mBody').innerHTML=html;const f=$('#mFoot');f.innerHTML='';
  (buttons||[['確定']]).forEach(([label,fn,cls])=>{const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;
    b.onclick=()=>{let keep=false;if(fn)keep=fn()===false;if(!keep&&$('#mTitle').textContent===title)closeModal()};f.appendChild(b)});
  $('#modalBg').classList.add('show');
  setTimeout(()=>{const i=$('#mBody input,#mBody select');i&&i.focus()},30);
}
function closeModal(){$('#modalBg').classList.remove('show')}
$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};
function confirmBox(title,msg,ok){modal(title,`<p style="margin:0">${msg}</p>`,[['取消'],['確定',()=>{closeModal();ok()},'primary']])}
function promptBox(title,label,val,ok){
  modal(title,`<div class="field"><label>${esc(label)}</label><input id="pIn" style="width:100%"></div>`,[['取消'],['確定',()=>{const v=$('#pIn').value;closeModal();ok(v)},'primary']]);
  const i=$('#pIn');i.value=val;i.onkeydown=e=>{if(e.key==='Enter'){const v=i.value;closeModal();ok(v)}};
}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

$('#btnTheme').onclick=()=>{prefs.theme={light:'sepia',sepia:'dark',dark:'light'}[prefs.theme];applyPrefs();savePrefs()};
$('#btnBinder').onclick=()=>{if(innerWidth<=640){document.body.classList.toggle('show-binder')}else{prefs.binder=!prefs.binder;applyPrefs();savePrefs()}};
$('#btnInsp').onclick=()=>{if(innerWidth<=900){document.body.classList.toggle('show-insp')}else{prefs.insp=!prefs.insp;applyPrefs();savePrefs()}};
$('#fontUp').onclick=()=>{prefs.font=Math.min(30,prefs.font+1);applyPrefs();savePrefs();document.querySelectorAll('.ed').forEach(autosize)};
$('#fontDown').onclick=()=>{prefs.font=Math.max(13,prefs.font-1);applyPrefs();savePrefs();document.querySelectorAll('.ed').forEach(autosize)};
$('#widthBtn').onclick=()=>{const ws=[600,720,860,1040];prefs.width=ws[(ws.indexOf(prefs.width)+1)%ws.length]||720;applyPrefs();savePrefs();document.querySelectorAll('.ed').forEach(autosize);toast('版面寬度 '+prefs.width+'px')};
addEventListener('resize',()=>document.querySelectorAll('.ed').forEach(autosize));
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(e.key==='Escape'){if($('#modalBg').classList.contains('show'))closeModal();else if(compId)closeComp();hideMenu();return}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow();toast('已儲存');return}
  if(mod&&['1','2','3'].includes(e.key)){e.preventDefault();S.view=['editor','cork','outline'][+e.key-1];renderMain();return}
  if(e.key==='F9'){e.preventDefault();compId?closeComp():openComp();return}
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&compId)closeComp()});
addEventListener('beforeunload',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});

/* ========== 啟動 ========== */
load();applyPrefs();document.title=P.title+' · 墨匣';renderAll();saveNow();
if(P.firstSel){delete P.firstSel}
</script>
</body>
</html>
