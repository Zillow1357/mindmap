<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨匣 InkBox · 故事寫作工作室</title>
<meta name="description" content="仿 Scrivener 的瀏覽器故事寫作工具：文件夾、收藏集、軟木板（自由排列）、大綱、故事線、關鍵字、自訂欄位、快照、分割編輯、專注模式與輸出。">
<style>
:root{
  --bg:#f4f1ea;--panel:#ebe6dc;--panel2:#e2dccf;--line:#d3cbbb;--text:#2b2620;--muted:#7a7064;
  --accent:#9a5b2c;--paper:#fffdf8;--sel:#d9cdb6;--cork:#b98f5f;--card:#fffef4;--board:#f7f5f0;
  --shadow:0 1px 3px rgba(0,0,0,.18);--serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --bw:260px;--iw:300px;--font:19px;--width:720px;--lh:1.95;
}
[data-theme=sepia]{--bg:#efe4cf;--panel:#e6d8bd;--panel2:#dccbab;--line:#c9b48f;--text:#3b2f22;--muted:#7d6a52;--paper:#f8efdc;--sel:#d2bd96;--card:#fbf3e1;--board:#f3e9d6}
[data-theme=dark]{--bg:#1c1e21;--panel:#24272b;--panel2:#2c2f34;--line:#3a3e45;--text:#e4e0d8;--muted:#9a958c;--accent:#e0a060;--paper:#26292d;--sel:#3c4048;--cork:#4b3f31;--card:#32353a;--board:#202326;--shadow:0 1px 4px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;
  display:grid;grid-template-rows:46px 1fr 30px;grid-template-columns:var(--bw) 1fr var(--iw);
  grid-template-areas:"top top top" "binder main insp" "foot foot foot";overflow:hidden}
body.no-binder{--bw:0px} body.no-insp{--iw:0px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--panel2);border-color:var(--line)}
button.on{background:var(--sel);border-color:var(--accent)}
input,select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:5px 7px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}

/* 頂列 */
#top{grid-area:top;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#top .brand{font-family:var(--serif);font-weight:700;color:var(--accent);margin-right:2px;white-space:nowrap}
#projTitle{font-family:var(--serif);font-weight:600;background:transparent;border-color:transparent;width:170px}
#projTitle:hover{border-color:var(--line)}
#top .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#top .grow{flex:1}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px;white-space:nowrap}.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}.seg button:last-child{border-radius:0 6px 6px 0}

/* 文件夾面板 */
#binder{grid-area:binder;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;min-width:0}
#binder .head{padding:8px 8px 4px}
#search{width:100%}
#btabs{display:flex;gap:3px;padding:4px 8px 6px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none;scrollbar-width:thin}
.btab{font-size:12px;padding:2px 8px;border-radius:12px;white-space:nowrap;display:flex;align-items:center;gap:4px;background:transparent}
.btab i{width:8px;height:8px;border-radius:2px;display:inline-block}
.btab.on{background:var(--sel);border-color:var(--accent)}
.btab.drop{outline:2px dashed var(--accent)}
#tree{flex:1;overflow:auto;padding:6px 0;user-select:none}
.node{display:flex;align-items:center;gap:4px;padding:3px 8px;cursor:pointer;border-top:2px solid transparent;border-bottom:2px solid transparent;white-space:nowrap}
.node:hover{background:var(--panel2)}
.node.sel{background:var(--sel)}
.node .caret{width:14px;text-align:center;color:var(--muted);font-size:10px;flex:none}
.node .ico{flex:none;width:18px;text-align:center}
.node .ttl{overflow:hidden;text-overflow:ellipsis;flex:1}
.node .dot{width:8px;height:8px;border-radius:50%;flex:none}
.node.root .ttl{font-weight:600}
.node.drop-before{border-top-color:var(--accent)}
.node.drop-after{border-bottom-color:var(--accent)}
.node.drop-inside{background:var(--sel);outline:1px dashed var(--accent)}
.node.excluded .ttl{opacity:.55}
#binder .foot{display:flex;gap:4px;padding:6px;border-top:1px solid var(--line)}
#binder .foot button{flex:1;padding:4px 2px;font-size:12px}
.result{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.result:hover{background:var(--panel2)}
.result small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
mark{background:#f3d27a;color:#2b2620;border-radius:2px}
.tbar{padding:6px 10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}

/* 主區 */
#main{grid-area:main;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#crumb{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted);min-height:38px}
#crumb .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumb .path b{color:var(--text)}
#crumb .nav{padding:1px 8px;font-size:15px}
#viewTools{display:flex;align-items:center;gap:6px;white-space:nowrap}
#viewTools select{padding:2px 4px;font-size:12px}
#viewTools label{font-size:12px}
#fmtbar{display:flex;align-items:center;gap:2px;padding:4px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;flex:none}
#fmtbar button{padding:2px 7px;min-width:28px;height:28px;background:transparent;border-color:transparent;display:inline-flex;align-items:center;justify-content:center}
#fmtbar button:hover{background:var(--panel2);border-color:var(--line)}
#fmtbar button.on{background:var(--sel);border-color:var(--accent)}
#fmtbar select{padding:3px 4px;font-size:13px;height:28px}
#fmtbar .vs{width:1px;height:20px;background:var(--line);margin:0 4px}
#fmtbar .grow{flex:1}
.clr{position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;cursor:pointer;font-weight:700;font-family:var(--serif)}
.clr:hover{background:var(--panel2)}
.clr input{position:absolute;inset:auto 4px 2px 4px;width:20px;height:5px;padding:0;border:none;opacity:1;cursor:pointer}
.clr input::-webkit-color-swatch-wrapper{padding:0}.clr input::-webkit-color-swatch{border:none;border-radius:1px}
#view{flex:1;display:flex;overflow:hidden;min-height:0}
.pane{flex:1;overflow:auto;position:relative;min-width:0}
.pane.split{border-left:3px double var(--line)}
.splithead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.splithead b{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.splithead button{padding:1px 7px;font-size:12px}

/* 編輯器 */
.paper{max-width:var(--width);margin:28px auto 120px;background:var(--paper);box-shadow:var(--shadow);border-radius:3px;padding:44px 56px 60px;min-height:70vh}
.split .paper{margin:16px 14px 80px}
.paper .dtitle{font-family:var(--serif);font-size:calc(var(--font) * 1.35);font-weight:700;border:none;background:transparent;width:100%;padding:0 0 10px;margin-bottom:14px;border-bottom:1px solid var(--line);border-radius:0}
.ed{position:relative;width:100%;outline:none;font-family:var(--serif);font-size:var(--font);line-height:var(--lh);min-height:50vh;letter-spacing:.02em;word-break:break-word;caret-color:var(--accent)}
.ed p{margin:0 0 .25em}
body.indent .ed>p:not([style*=center]):not([style*=right]){text-indent:2em}
.ed h2{font-size:1.4em;margin:.6em 0 .4em;line-height:1.5}
.ed h3{font-size:1.15em;margin:.6em 0 .3em;line-height:1.5}
.ed blockquote{margin:.6em 2em;color:var(--muted);font-size:.94em;border-left:3px solid var(--line);padding-left:1em}
.ed ul,.ed ol{margin:.3em 0;padding-left:2em}
.ed hr,.ed p.sep{border:none;text-align:center;color:var(--muted);text-indent:0!important}
.ed hr::after{content:"＊　＊　＊"}
.ed.blank::before{content:attr(data-ph);position:absolute;left:0;top:0;color:var(--muted);opacity:.6;pointer-events:none}
.scriv{border-top:1px dashed var(--line);padding-top:16px;margin-top:18px}
.scriv:first-of-type{border-top:none;margin-top:0;padding-top:0}
.scriv .stitle{font-size:12px;color:var(--muted);margin-bottom:6px;cursor:pointer}
.scriv .stitle:hover{color:var(--accent)}
.scriv .ed{min-height:3em}
.folderhead{font-family:var(--serif);font-size:calc(var(--font) * 1.2);font-weight:700;margin:26px 0 6px;color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:80px 20px;line-height:2}

/* 卡片 */
.card{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.25);border-radius:3px;height:170px;display:flex;flex-direction:column;position:relative;cursor:grab;
  border-left:5px solid var(--lc,transparent);
  background-image:repeating-linear-gradient(transparent 0 23px,rgba(120,150,200,.16) 23px 24px);background-position:0 36px}
.card.sel{outline:3px solid var(--accent)}
.card .ct{display:flex;align-items:center;gap:6px;font-weight:700;padding:7px 10px 5px;border-bottom:1px solid rgba(200,80,80,.35);font-family:var(--serif);background:var(--card)}
.card .ctt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.card .ci{font-size:12px;opacity:.7}
.card textarea{flex:1;border:none;background:transparent;resize:none;padding:4px 10px;font-size:13px;line-height:24px;font-family:var(--serif);border-radius:0}
.card .cf{display:flex;align-items:center;gap:3px;padding:0 8px 6px;min-height:18px}
.card .cf i{width:10px;height:10px;border-radius:2px;display:inline-block}
.card .stamp{margin-left:auto;font-size:11px;color:#c0392b;border:1.5px solid #c0392b;border-radius:3px;padding:0 4px;transform:rotate(-6deg);opacity:.85;background:var(--card)}
.card.drop-l{box-shadow:-6px 0 0 var(--accent),0 3px 8px rgba(0,0,0,.25)}
.card.drop-r{box-shadow:6px 0 0 var(--accent),0 3px 8px rgba(0,0,0,.25)}
.card.dragging{opacity:.85;box-shadow:0 10px 24px rgba(0,0,0,.35);cursor:grabbing}
.card.add{background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.6);box-shadow:none;align-items:center;justify-content:center;color:#fff;font-size:15px;cursor:pointer}

/* 軟木板 */
.cork{min-height:100%;padding:24px;background:var(--cork);
  background-image:radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);
  background-size:7px 7px,11px 11px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;align-content:start}
.cork.free{display:block;position:relative;padding:0}
.cork.free .card{position:absolute;width:230px}
.cork.plain{background:var(--board);background-image:none}
.cork.plain .card.add{border-color:var(--line);color:var(--muted)}

/* 故事線 */
.story{position:relative;background:var(--board)}
.story .line{position:absolute;height:4px;border-radius:2px;opacity:.85}
.story .rowlab{position:absolute;left:0;width:140px;display:flex;align-items:center;gap:6px;padding:0 10px;font-weight:600;font-size:13px}
.story .rowlab i{width:12px;height:12px;border-radius:3px;flex:none}
.story .axis{position:absolute;top:8px;width:240px;text-align:center;font-size:11px;color:var(--muted)}
.story .card{position:absolute;width:214px;height:150px}
.story .vline{position:absolute;top:28px;width:1px;background:var(--line);opacity:.6}

/* 大綱 */
.outline{border-collapse:collapse;font-size:13px;min-width:100%}
.outline th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600;z-index:1;white-space:nowrap}
.outline td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.outline tr{cursor:pointer}
.outline tbody tr:hover td{background:var(--panel)}
.outline tr.sel td{background:var(--sel)}
.outline .syn{color:var(--muted);min-width:200px;max-width:360px}
.outline .num{text-align:right;font-variant-numeric:tabular-nums}
.outline tr.folder td:first-child{font-weight:600}
.kwdots i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px}

/* 檢視器 */
#insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-width:0}
.sec{border-bottom:1px solid var(--line)}
.sec summary{list-style:none;cursor:pointer;padding:8px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;user-select:none}
.sec summary::-webkit-details-marker{display:none}
.sec summary::before{content:"▸";color:var(--muted);font-size:11px;transition:transform .15s}
.sec[open] summary::before{transform:rotate(90deg)}
.sec summary .gear{margin-left:auto;padding:0 6px;font-size:12px;background:transparent;border-color:transparent}
.sec summary .gear:hover{border-color:var(--line)}
.secb{padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px}
#insp label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
#insp input:not([type=checkbox]):not([type=color]),#insp select,#insp textarea{width:100%}
#insp textarea{resize:vertical;font-family:var(--serif);line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex!important;align-items:center;gap:6px;color:var(--text)!important;font-size:13px!important;margin:0!important;cursor:pointer}
.meta{font-size:12px;color:var(--muted);line-height:1.8;padding:10px 12px}
.snap{display:flex;align-items:center;gap:4px;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.snap span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snap button{padding:1px 6px;font-size:11px}
.prog{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:4px}
.prog.big{height:12px;border-radius:2px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.prog.blue i{background:#5bc0eb}
.kws{display:flex;flex-direction:column;gap:2px}
.kwrow{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:4px;background:var(--paper);font-size:13px}
.kwrow i{width:14px;height:14px;border-radius:2px;flex:none}
.kwrow span{flex:1}
.kwrow button{padding:0 6px;font-size:11px;background:transparent;border-color:transparent}
.fld .chk{padding:2px 0}

/* 頁尾 */
#foot{grid-area:foot;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
#foot .mini{display:inline-block;width:70px;height:5px;background:var(--panel2);border-radius:3px;vertical-align:middle;margin-left:4px;overflow:hidden}
#foot .mini i{display:block;height:100%;background:var(--accent)}
#saved{margin-left:auto}

/* 浮動視窗：專案目標 */
.float{position:fixed;z-index:45;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.28);width:280px;display:none}
.float.show{display:block}
.float .fh{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:move;font-size:13px;user-select:none}
.float .fh span{flex:1}
.float .fh button{padding:0 7px;background:#d9534f;color:#fff;border:none;border-radius:3px}
.float .fb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.float h4{display:flex;align-items:center;justify-content:space-between;margin:6px 0 0;font-size:13px}
.float h4 button{font-size:11px;padding:1px 8px;font-weight:400}
.tgrow{display:flex;align-items:center;gap:6px;font-size:13px}
.tgrow input{width:100px;padding:2px 5px}
.tgrow label{font-size:12px;color:var(--muted)}
h4{margin:0;font-size:12px;color:var(--muted);font-weight:600}

/* 專注模式 */
#comp{position:fixed;inset:0;background:#141517;z-index:50;display:none;flex-direction:column;align-items:center}
#comp.show{display:flex}
#comp .wrap{flex:1;overflow:auto;width:100%;display:flex;justify-content:center}
#comp .ed{width:min(var(--width),92vw);color:#d8d4cb;padding:16vh 0 50vh;min-height:100%;font-size:calc(var(--font) + 1px)}
#comp .ed blockquote{color:#999}
#comp .cbar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:12px;align-items:center;justify-content:center;padding:10px;color:#888;font-size:13px;opacity:0;transition:opacity .3s;background:linear-gradient(transparent,#141517 40%)}
#comp .cbar:hover,#comp.active .cbar{opacity:1}
#comp .cbar button{background:#2a2c30;border-color:#3a3d42;color:#ccc}

/* 對話框、選單、提示 */
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:60}
#modalBg.show{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.35);width:min(600px,94vw);max-height:88vh;display:flex;flex-direction:column}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--serif)}
.modal .mb{padding:16px 18px;overflow:auto;line-height:1.7}
.modal .mb .field{margin-bottom:12px}
.modal .mb label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal pre{white-space:pre-wrap;font-family:var(--serif);background:var(--paper);padding:12px;border-radius:6px;max-height:55vh;overflow:auto;margin:0}
.modal .snapview{background:var(--paper);padding:14px 18px;border-radius:6px;max-height:55vh;overflow:auto}
.modal .snapview .ed{min-height:0;font-size:16px}
.frow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.frow .fn{flex:1;min-width:0}.frow .fo{flex:1.4;min-width:0}
.frow input[type=color]{width:34px;height:30px;padding:1px}
.frow .cnt{font-size:12px;color:var(--muted);width:48px;text-align:right}
#menu{position:fixed;z-index:70;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:4px;display:none;min-width:180px}
#menu div{padding:6px 12px;border-radius:5px;cursor:pointer}
#menu div:hover{background:var(--sel)}
#menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:80}
#toast.show{opacity:.92}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}

@media (max-width:1100px){.hide-md{display:none}}
@media (max-width:900px){
  body{--iw:0px}
  body.show-insp #insp{position:fixed;right:0;top:46px;bottom:30px;width:300px;z-index:40;box-shadow:-4px 0 16px rgba(0,0,0,.2)}
  #projTitle{width:100px}
  .hide-sm{display:none}
  .paper{padding:28px 22px 40px;margin:12px 8px 80px}
}
@media (max-width:640px){
  body{--bw:0px}
  body.show-binder #binder{position:fixed;left:0;top:46px;bottom:30px;width:260px;z-index:40;box-shadow:4px 0 16px rgba(0,0,0,.2)}
  #top .brand{display:none}
  .seg button span{display:none}
}
</style>
</head>
<body class="indent">

<header id="top">
  <button class="ghost" id="btnBinder" title="切換文件夾面板">☰</button>
  <span class="brand">墨匣</span>
  <input id="projTitle" title="專案名稱">
  <span class="sep"></span>
  <div class="seg" id="viewSeg">

'use strict';
/* ================= 常數 ================= */
const KEY='inkbox-project-v1', PREFKEY='inkbox-prefs-v1';

/* ================= 文字與 HTML 工具 ================= */
const CJK=/[㐀-䶿一-鿿豈-﫿぀-ヿ가-힯]/g;
function wc(t){if(!t)return 0;const c=(t.match(CJK)||[]).length;const w=(t.replace(CJK,' ').match(/[A-Za-z0-9À-ɏ'’-]+/g)||[]).length;return c+w}
const ALLOWED=new Set(['P','BR','B','STRONG','I','EM','U','S','STRIKE','DEL','H2','H3','H4','BLOCKQUOTE','UL','OL','LI','SPAN','FONT','DIV','MARK','HR','SUB','SUP']);
const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','TEMPLATE','SVG','MATH','IMG','VIDEO','AUDIO','FORM','INPUT','BUTTON','TEXTAREA','SELECT']);
const STYLE_OK=['color','background-color','text-align','font-weight','font-style','text-decoration','text-decoration-line'];
function sanitize(html){
  const t=document.createElement('template');t.innerHTML=html||'';
  (function clean(node){[...node.childNodes].forEach(n=>{
    if(n.nodeType===3)return;
    if(n.nodeType!==1){n.remove();return}
    if(DROP.has(n.tagName)){n.remove();return}
    if(/^H[1]$/.test(n.tagName)){const h=document.createElement('h2');h.append(...n.childNodes);n.replaceWith(h);clean(h);return}
    if(/^H[56]$/.test(n.tagName)){const h=document.createElement('h4');h.append(...n.childNodes);n.replaceWith(h);clean(h);return}
    if(!ALLOWED.has(n.tagName)){clean(n);n.replaceWith(...n.childNodes);return}
    [...n.attributes].forEach(a=>{const nm=a.name.toLowerCase();
      if(nm==='style'){const keep=[];STYLE_OK.forEach(p=>{const v=n.style.getPropertyValue(p);if(v&&!/url|expression|javascript/i.test(v))keep.push(p+':'+v)});if(keep.length)n.setAttribute('style',keep.join(';'));else n.removeAttribute('style')}
      else if(nm==='color'&&n.tagName==='FONT'&&/^[#a-z0-9(),.\s]+$/i.test(a.value)){}
      else if(nm==='class'&&a.value==='sep'){}
      else n.removeAttribute(a.name)});
    clean(n);
  })})(t.content);
  return t.innerHTML;
}
function textToHTML(t){return (t||'').split(/\n/).filter(l=>l.trim()).map(l=>`<p>${esc(l)}</p>`).join('')}
function textOf(el){let s='';el.childNodes.forEach(c=>{if(c.nodeType===3)s+=c.textContent;else if(c.nodeType===1){if(c.tagName==='BR')s+='\n';else if(/^(P|DIV|LI|H\d|BLOCKQUOTE)$/.test(c.tagName))s+=(s&&!s.endsWith('\n')?'\n':'')+textOf(c)+'\n';else s+=textOf(c)}});return s.replace(/\n+$/,'')}
function htmlBlocks(html){
  const t=document.createElement('template');t.innerHTML=html||'';const out=[];let buf=null;
  const flush=()=>{if(buf){if(buf.text.trim())out.push(buf);buf=null}};
  const BLOCK=/^(P|DIV|H\d|BLOCKQUOTE|UL|OL|HR|LI)$/;
  t.content.childNodes.forEach(n=>{
    if(n.nodeType===1&&BLOCK.test(n.tagName)){flush();
      if(n.tagName==='UL'||n.tagName==='OL'){[...n.children].forEach((li,i)=>out.push({tag:n.tagName==='UL'?'ul':'ol',n:i+1,text:textOf(li),inner:li.innerHTML}))}
      else if(n.tagName==='HR')out.push({tag:'sep',text:'',inner:''});
      else{const tag=n.classList.contains('sep')?'sep':(/^H\d$/.test(n.tagName)?'h':n.tagName==='BLOCKQUOTE'?'quote':'p');
        out.push({tag,level:+(n.tagName[1])||0,text:textOf(n),inner:n.innerHTML,align:n.style.textAlign||''})}
    }else if(n.nodeType===1&&n.tagName==='BR'){flush()}
    else if(n.nodeType===1||n.nodeType===3){if(!buf)buf={tag:'p',text:'',inner:'',align:''};buf.text+=n.nodeType===1?textOf(n):n.textContent;buf.inner+=n.nodeType===1?n.outerHTML:esc(n.textContent)}
  });flush();
  return out.filter(b=>b.tag==='sep'||b.text.trim()!=='');
}
function plain(html){return htmlBlocks(html).map(b=>b.tag==='sep'?'＊　＊　＊':b.text).join('\n')}
function inlineMD(html){
  const t=document.createElement('template');t.innerHTML=html||'';
  const walk=n=>{let s='';n.childNodes.forEach(c=>{if(c.nodeType===3){s+=c.textContent;return}if(c.nodeType!==1)return;const inner=walk(c);
    switch(c.tagName){case 'B':case 'STRONG':s+=inner.trim()?`**${inner}**`:inner;break;case 'I':case 'EM':s+=inner.trim()?`*${inner}*`:inner;break;
      case 'S':case 'STRIKE':case 'DEL':s+=inner.trim()?`~~${inner}~~`:inner;break;case 'BR':s+='  \n';break;default:s+=inner}});return s};
  return walk(t.content);
}
function setContent(it,html){it.content=html;it.wc=wc(plain(html))}

/* ================= 資料模型 ================= */
function mk(type,title,extra){return Object.assign({id:uid(),type,title,content:'',wc:0,synopsis:'',notes:'',label:'',status:'',section:'',compile:true,target:0,keywords:[],meta:{},children:[],snapshots:[],created:Date.now(),modified:Date.now()},extra||{})}

  const c2=add(mk('doc','老闆娘（秋姨）',{compile:false,label:'char',keywords:[kB.id],synopsis:'海鷗旅店老闆娘，五十多歲，左手少一根手指。',content:CHAR_TEMPLATE.replace('姓名：','姓名：秋姨')}));

【檢視器】概要、標籤、狀態、段落類型、自訂欄位、關鍵字、筆記、快照。

【目標】浮動的專案目標視窗，可設全稿、本次與截稿日。

資料自動存在瀏覽器（localStorage），請定期用「專案 → 匯出專案檔」備份！
快捷鍵：Ctrl/⌘+S 儲存　Ctrl/⌘+1~4 切換檢視　Ctrl/⌘+B/I/U 格式　F9 專注模式　Alt+←/→ 上一個／下一個　Esc 離開`)}));

function migrate(p){
  if(!p.version||p.version<2){
    for(const k in p.items){const it=p.items[k];it.content=textToHTML(it.content||'');(it.snapshots||[]).forEach(s=>s.content=textToHTML(s.content||''))}
    p.version=2;
  }
  p.keywords=p.keywords||[];p.fields=p.fields||[];p.collections=p.collections||[];
  p.targets=Object.assign({project:80000,session:1000,deadline:''},p.targets||{});
  for(const k in p.items){const it=p.items[k];
    it.keywords=it.keywords||[];it.meta=it.meta||{};it.section=it.section||'';it.snapshots=it.snapshots||[];it.children=it.children||[];
    it.content=sanitize(it.content||'');it.snapshots.forEach(s=>s.content=sanitize(s.content||''));
    it.wc=wc(plain(it.content));}
  return p;
}
function item(id){return P.items[id]}
function parentOf(id){for(const k in P.items){if(P.items[k].children.includes(id))return k}return null}
function rootOf(id){let c=id,p;while((p=parentOf(c)))c=p;return c}
function inTrash(id){return item(rootOf(id))?.special==='trash'}
function isAncestor(a,b){let p=parentOf(b);while(p){if(p===a)return true;p=parentOf(p)}return false}
function pathOf(id){const out=[];let c=id;while(c){out.unshift(c);c=parentOf(c)}return out}
function touch(it){if(it)it.modified=Date.now();save()}
function descendants(id,depth=0,out=[]){item(id).children.forEach(c=>{out.push({id:c,depth});descendants(c,depth+1,out)});return out}
function detach(id){const p=parentOf(id);if(p){const a=item(p).children;a.splice(a.indexOf(id),1)}}
function totalWords(id,onlyCompile){const it=item(id);if(!it||(onlyCompile&&!it.compile))return 0;return (it.wc||0)+it.children.reduce((s,c)=>s+totalWords(c,onlyCompile),0)}
const kwById=id=>P.keywords.find(k=>k.id===id);

function load(){
  try{P=JSON.parse(localStorage.getItem(KEY))}catch(e){P=null}
  P=(P&&P.items&&P.roots)?migrate(P):sampleProject();
  try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREFKEY))||{})}catch(e){}
  prefs.closed=prefs.closed||{};
  const first=P.firstSel&&item(P.firstSel)?P.firstSel:(P.lastSel&&item(P.lastSel)?P.lastSel:P.roots[0]);
  delete P.firstSel;
  S.expanded=P.expanded||{};
  S.sel=S.insp=first;S.hist=[first];S.hpos=0;
  if(!sessionStorage.getItem('inkbox-session-start'))resetSession();
}
function resetSession(){sessionStorage.setItem('inkbox-session-start',totalWords(P.roots[0],false))}
function applyPrefs(){
  const r=document.documentElement;r.dataset.theme=prefs.theme;
  r.style.setProperty('--font',prefs.font+'px');r.style.setProperty('--width',prefs.width+'px');r.style.setProperty('--lh',prefs.lh);
  document.body.classList.toggle('no-binder',!prefs.binder);
  document.body.classList.toggle('no-insp',!prefs.insp);
  document.body.classList.toggle('indent',!!prefs.indent);
  $('#btnTheme').textContent={light:'☀',sepia:'☕',dark:'☾'}[prefs.theme];
}

/* ================= 選取與導覽 ================= */
function select(id,o={}){
  if(!item(id))return;
  if(!o.nohist&&S.sel!==id){S.hist=S.hist.slice(0,S.hpos+1);S.hist.push(id);if(S.hist.length>100)S.hist.shift();S.hpos=S.hist.length-1}
  S.sel=id;S.insp=id;P.lastSel=id;
  pathOf(id).slice(0,-1).forEach(a=>S.expanded[a]=true);
  P.expanded=S.expanded;
  if(!o.keepView&&item(id).type==='folder'&&S.view==='editor'&&!descendants(id).some(d=>item(d.id).type==='doc'))S.view='cork';
  renderAll();save();
  document.body.classList.remove('show-binder');
}
function nav(d){let p=S.hpos+d;while(p>=0&&p<S.hist.length&&!item(S.hist[p]))p+=d;if(p<0||p>=S.hist.length)return;S.hpos=p;select(S.hist[p],{nohist:true,keepView:true})}
function openItem(id){S.view=item(id).type==='folder'?(S.view==='editor'?'cork':S.view):'editor';select(id,{keepView:true})}
function setInsp(id){if(!item(id))return;S.insp=id;renderInspector();renderFooter();highlightInMain()}

/* ================= 文件夾面板 ================= */
function renderBinder(){
  if(S.tab!=='binder'&&S.tab!=='search'&&!P.collections.find(c=>c.id===S.tab))S.tab='binder';
  if(S.tab==='search'&&!S.search.trim())S.tab='binder';
  renderTabs();
  const tree=$('#tree');tree.innerHTML='';
  if(S.tab==='search')renderSearch(tree);
  else if(S.tab==='binder')P.roots.forEach(r=>tree.appendChild(nodeEl(r,0)));
  else renderColl(tree,P.collections.find(c=>c.id===S.tab));
}
function renderTabs(){
  const t=$('#btabs');t.innerHTML='';
  const mkTab=(key,label,color)=>{const b=document.createElement('button');b.className='btab'+(S.tab===key?' on':'');b.innerHTML=(color?`<i style="background:${color}"></i>`:'')+esc(label);b.onclick=()=>{S.tab=key;renderBinder()};t.appendChild(b);return b};
  mkTab('binder','📁 文件夾');
  if(S.search.trim())mkTab('search','🔍 搜尋結果');
  P.collections.forEach(c=>{const b=mkTab(c.id,c.name,c.color);b.title='收藏集：右鍵可重新命名或刪除；可把文件拖到這裡';
    b.oncontextmenu=e=>{e.preventDefault();collMenu(e,c)};
    b.ondragover=e=>{if(S.drag){e.preventDefault();b.classList.add('drop')}};
    b.ondragleave=()=>b.classList.remove('drop');
    b.ondrop=e=>{e.preventDefault();b.classList.remove('drop');if(S.drag)addToColl(c,S.drag)}});
  const add=document.createElement('button');add.className='btab';add.textContent='＋';add.title='新增收藏集';add.onclick=()=>newCollection();t.appendChild(add);
}
function iconFor(it){
  if(it.special==='draft')return '📕';
  if(it.special==='research')return '📚';
  if(it.special==='trash')return it.children.length?'🗑️':'🗑';
  if(it.type==='folder')return S.expanded[it.id]===false?'📁':'📂';
  return it.children.length?'📑':(it.wc?'📄':'🗋');
}
function nodeEl(id,depth){
  const it=item(id),wrap=document.createElement('div');
  const row=document.createElement('div');
  const has=it.children.length>0,open=S.expanded[id]!==false;
  row.className='node'+(S.sel===id?' sel':'')+(it.special?' root':'')+(!it.compile&&!it.special&&rootOf(id)===P.roots[0]?' excluded':'');
  row.style.paddingLeft=(6+depth*15)+'px';
  row.dataset.id=id;row.draggable=!it.special;
  row.innerHTML=`<span class="caret">${has?(open?'▼':'▶'):''}</span><span class="ico">${iconFor(it)}</span><span class="ttl">${esc(it.title||'未命名')}</span>${it.label?`<span class="dot" style="background:${labelOf(it.label).color}"></span>`:''}`;
  row.querySelector('.caret').onclick=e=>{e.stopPropagation();if(has){S.expanded[id]=!open;P.expanded=S.expanded;renderBinder();save()}};
  row.onclick=()=>select(id);
  row.ondblclick=e=>{if(!e.target.classList.contains('caret')&&it.special!=='trash')renameInline(row,id)};
  row.oncontextmenu=e=>{e.preventDefault();select(id);showMenu(e.clientX,e.clientY,id)};
  row.ondragstart=e=>{S.drag=id;e.dataTransfer.effectAllowed='copyMove';e.dataTransfer.setData('text/plain',id)};
  row.ondragend=()=>{S.drag=null;clearDrop()};
  row.ondragover=e=>{
    if(!S.drag||S.drag===id||isAncestor(S.drag,id))return;
    e.preventDefault();clearDrop();
    const r=row.getBoundingClientRect(),y=(e.clientY-r.top)/r.height;
    const zone=it.special?'inside':(y<.28?'before':y>.72?'after':'inside');
    row.classList.add('drop-'+zone);row.dataset.zone=zone;
  };
  row.ondragleave=()=>row.classList.remove('drop-before','drop-after','drop-inside');
  row.ondrop=e=>{e.preventDefault();const z=row.dataset.zone;clearDrop();if(S.drag&&z)moveItem(S.drag,id,z)};
  wrap.appendChild(row);
  if(has&&open)it.children.forEach(c=>wrap.appendChild(nodeEl(c,depth+1)));
  return wrap;
}
function clearDrop(){document.querySelectorAll('.drop-before,.drop-after,.drop-inside').forEach(n=>n.classList.remove('drop-before','drop-after','drop-inside'))}
function moveItem(id,target,zone){
  if(id===target||isAncestor(id,target)||item(id).special)return;
  detach(id);
  if(zone==='inside'){item(target).children.push(id);S.expanded[target]=true}
  else{const a=item(parentOf(target)).children;let i=a.indexOf(target);if(zone==='after')i++;a.splice(i,0,id)}
  touch(item(id));renderAll();
}
function renameInline(row,id){
  const it=item(id),span=row.querySelector('.ttl');if(!span)return;
  const inp=document.createElement('input');inp.value=it.title;inp.style.cssText='flex:1;padding:1px 4px;min-width:0';
  span.replaceWith(inp);inp.focus();inp.select();row.draggable=false;
  let done=false;
  const commit=ok=>{if(done)return;done=true;if(ok&&inp.value.trim()){it.title=inp.value.trim();touch(it)}renderAll()};
  inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')commit(true);if(e.key==='Escape')commit(false)};
  inp.onblur=()=>commit(true);inp.onclick=e=>e.stopPropagation();
}
function searchHits(){
  const q=S.search.trim().toLowerCase();const hits=[];if(!q)return hits;
  for(const id in P.items){const it=P.items[id];if(it.special)continue;
    const fields=[it.title,plain(it.content),it.synopsis,it.notes,...it.keywords.map(k=>kwById(k)?.name||''),...Object.values(it.meta).map(v=>typeof v==='string'?v:'')];
    const f=fields.find(x=>x&&x.toLowerCase().includes(q));
    if(f!==undefined){const i=f.toLowerCase().indexOf(q);hits.push({id,snip:f.slice(Math.max(0,i-12),i+q.length+28)})}}
  return hits;
}
function renderSearch(tree){
  const hits=searchHits();
  const bar=document.createElement('div');bar.className='tbar';bar.innerHTML=`<span>${hits.length} 筆結果</span>`;
  if(hits.length){const b=document.createElement('button');b.textContent='存成收藏集';b.style.fontSize='12px';b.onclick=()=>newCollection('搜尋：'+S.search.trim(),hits.map(h=>h.id));bar.appendChild(b)}
  tree.appendChild(bar);
  const re=new RegExp(S.search.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  hits.forEach(h=>{const d=document.createElement('div');d.className='result';
    d.innerHTML=`${iconFor(item(h.id))} ${esc(item(h.id).title)}<small>${esc(h.snip).replace(re,m=>'<mark>'+m+'</mark>')}</small>`;
    d.onclick=()=>openItem(h.id);tree.appendChild(d)});
}

/* ================= 收藏集 ================= */
function newCollection(name,ids){
  const go=n=>{n=(n||'').trim();if(!n)return;const c={id:uid(),name:n,color:PALETTE[P.collections.length%PALETTE.length],ids:ids||[]};P.collections.push(c);S.tab=c.id;save();renderBinder();toast('已建立收藏集：'+n)};
  if(name)go(name);else promptBox('新增收藏集','名稱','',go);
}
function addToColl(c,id){if(!c.ids.includes(id)){c.ids.push(id);save();toast(`已加入「${c.name}」`)}else toast('已在收藏集中');renderBinder()}
function collMenu(e,c){
  showMenuItems(e.clientX,e.clientY,[
    ['重新命名',()=>promptBox('重新命名收藏集','名稱',c.name,n=>{if(n.trim()){c.name=n.trim();save();renderBinder()}})],
    ['更換顏色',()=>{c.color=PALETTE[(PALETTE.indexOf(c.color)+1)%PALETTE.length];save();renderBinder()}],
    '-',['刪除收藏集',()=>confirmBox('刪除收藏集',`刪除「${esc(c.name)}」？（裡面的文件不會被刪除）`,()=>{P.collections.splice(P.collections.indexOf(c),1);S.tab='binder';save();renderBinder()})]]);
}
function renderColl(tree,c){
  c.ids=c.ids.filter(id=>item(id));
  if(!c.ids.length){tree.innerHTML='<div class="empty" style="padding:30px 14px;font-size:13px">收藏集是空的。<br>把文件從「文件夾」拖到上方分頁，或按右鍵「加入收藏集」。</div>';return}
  c.ids.forEach(id=>{const it=item(id);const row=document.createElement('div');row.className='node'+(S.sel===id?' sel':'');row.draggable=true;row.dataset.id=id;
    row.innerHTML=`<span class="ico">${iconFor(it)}</span><span class="ttl">${esc(it.title)}</span>${it.label?`<span class="dot" style="background:${labelOf(it.label).color}"></span>`:''}`;
    row.onclick=()=>select(id);
    row.oncontextmenu=e=>{e.preventDefault();select(id);showMenuItems(e.clientX,e.clientY,[['在文件夾中顯示',()=>{S.tab='binder';select(id)}],['在分割視窗開啟',()=>openSplit(id)],'-',['從收藏集移除',()=>{c.ids.splice(c.ids.indexOf(id),1);save();renderBinder()}]])};
    row.ondragstart=e=>{S.cdrag=id;e.dataTransfer.setData('text/plain',id)};
    row.ondragend=()=>{S.cdrag=null;clearDrop()};
    row.ondragover=e=>{if(!S.cdrag||S.cdrag===id)return;e.preventDefault();clearDrop();const r=row.getBoundingClientRect();const z=e.clientY<r.top+r.height/2?'before':'after';row.classList.add('drop-'+z);row.dataset.zone=z};
    row.ondrop=e=>{e.preventDefault();const z=row.dataset.zone;clearDrop();if(!S.cdrag)return;c.ids.splice(c.ids.indexOf(S.cdrag),1);let i=c.ids.indexOf(id);if(z==='after')i++;c.ids.splice(i,0,S.cdrag);S.cdrag=null;save();renderBinder()};
    tree.appendChild(row)});
}
function collDialog(id){
  const it=item(id);
  modal(`加入收藏集：${it.title}`,`${P.collections.map(c=>`<label class="chk" style="margin-bottom:6px!important"><input type="checkbox" data-c="${c.id}" ${c.ids.includes(id)?'checked':''}> <i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c.color}"></i> ${esc(c.name)}</label>`).join('')||'<p class="hint">還沒有收藏集。</p>'}
    <div class="field" style="margin-top:12px"><label>或建立新收藏集</label><input id="newColl" style="width:100%" placeholder="例如：待修改、第二稿重寫、伏筆清單"></div>`,
    [['取消'],['確定',()=>{document.querySelectorAll('#mBody [data-c]').forEach(cb=>{const c=P.collections.find(x=>x.id===cb.dataset.c);const has=c.ids.includes(id);if(cb.checked&&!has)c.ids.push(id);if(!cb.checked&&has)c.ids.splice(c.ids.indexOf(id),1)});
      const n=$('#newColl').value.trim();if(n)P.collections.push({id:uid(),name:n,color:PALETTE[P.collections.length%PALETTE.length],ids:[id]});save();renderBinder()},'primary']]);
}

/* ================= 新增／刪除／複製 ================= */
function addItem(type,where,opts){
  const base=where||S.sel||P.roots[0];const b=item(base);
  const it=mk(type,opts?.title||(type==='folder'?'新資料夾':'新文件'),opts?.extra);
  if(it.content)it.wc=wc(plain(it.content));
  P.items[it.id]=it;
  if(inTrash(base))item(P.roots[0]).children.push(it.id);
  else if(b.type==='folder'||b.special){b.children.push(it.id);S.expanded[base]=true}
  else{const a=item(parentOf(base)).children;a.splice(a.indexOf(base)+1,0,it.id)}
  if(rootOf(it.id)===P.roots[1])it.compile=false;
  touch(it);
  if(opts?.stay){renderAll();return it}
  if(type==='doc'&&S.view!=='cork')S.view='editor';
  select(it.id,{keepView:true});
  S.tab='binder';renderBinder();
  setTimeout(()=>{const r=document.querySelector(`#tree .node[data-id="${it.id}"]`);if(r)renameInline(r,it.id)},30);
  return it;
}
function removeAll(id){const it=item(id);it.children.forEach(removeAll);delete P.items[id];P.collections.forEach(c=>c.ids=c.ids.filter(x=>x!==id));if(S.split===id)S.split=null}
function trashItem(id){
  id=id||S.sel;const it=item(id);if(!it||it.special)return toast('這個資料夾無法刪除');
  const trash=P.roots[2];
  if(inTrash(id)){confirmBox('永久刪除',`確定永久刪除「${esc(it.title)}」及其所有內容？此動作無法復原。`,()=>{detach(id);removeAll(id);select(trash)});return}
  const p=parentOf(id);detach(id);item(trash).children.push(id);touch(it);toast(`已移至垃圾桶：${it.title}`);select(p);
}
function emptyTrash(){
  const t=item(P.roots[2]);if(!t.children.length)return toast('垃圾桶是空的');
  confirmBox('清空垃圾桶',`將永久刪除 ${t.children.length} 個項目，確定嗎？`,()=>{t.children.slice().forEach(c=>{detach(c);removeAll(c)});touch();select(t.id)});
}
function cloneDeep(id){const o=item(id);const c=JSON.parse(JSON.stringify(o));c.id=uid();c.created=c.modified=Date.now();c.children=o.children.map(cloneDeep);P.items[c.id]=c;return c.id}
function duplicate(id){const it=item(id);if(it.special)return;const nid=cloneDeep(id);item(nid).title=it.title+'（副本）';const a=item(parentOf(id)).children;a.splice(a.indexOf(id)+1,0,nid);touch(item(nid));select(nid,{keepView:true})}

/* ================= 右鍵選單 ================= */
function showMenu(x,y,id){
  const it=item(id);const opts=[];
  if(it.special==='trash')opts.push(['清空垃圾桶',emptyTrash]);
  else{
    opts.push(['＋ 新增文件',()=>addItem('doc',id)],['＋ 新增資料夾',()=>addItem('folder',id)],
      ['＋ 角色卡（範本）',()=>addItem('doc',id,{title:'新角色',extra:{content:CHAR_TEMPLATE,label:'char'}})],
      ['＋ 地點卡（範本）',()=>addItem('doc',id,{title:'新地點',extra:{content:PLACE_TEMPLATE}})],'-');
    opts.push(['在分割視窗開啟',()=>openSplit(id)],['加入收藏集…',()=>collDialog(id)]);
    if(!it.special)opts.push(['重新命名',()=>{S.tab='binder';renderBinder();const r=document.querySelector(`#tree .node[data-id="${id}"]`);r&&renameInline(r,id)}],['複製',()=>duplicate(id)],
      [it.compile?'從輸出排除':'納入輸出',()=>{it.compile=!it.compile;touch(it);renderAll()}],
      ...(it.type==='doc'?[['拍攝快照',()=>takeSnapshot(id)]]:[]),'-',[inTrash(id)?'永久刪除':'移至垃圾桶',()=>trashItem(id)]);
    if(it.children.length)opts.push('-',['全部展開',()=>{[id,...descendants(id).map(d=>d.id)].forEach(i=>S.expanded[i]=true);renderBinder()}],['全部收合',()=>{[id,...descendants(id).map(d=>d.id)].forEach(i=>S.expanded[i]=false);renderBinder()}]);
  }
  showMenuItems(x,y,opts);
}
function showMenuItems(x,y,opts){
  const m=$('#menu');m.innerHTML='';
  opts.forEach(o=>{if(o==='-'){m.appendChild(document.createElement('hr'));return}const d=document.createElement('div');d.textContent=o[0];d.onclick=()=>{hideMenu();o[1]()};m.appendChild(d)});
  m.style.display='block';const r=m.getBoundingClientRect();
  m.style.left=Math.max(4,Math.min(x,innerWidth-r.width-6))+'px';m.style.top=Math.max(4,Math.min(y,innerHeight-r.height-6))+'px';
}
function hideMenu(){$('#menu').style.display='none'}
document.addEventListener('click',e=>{if(!$('#menu').contains(e.target))hideMenu()});

document.addEventListener('selectionchange',()=>{
  const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0);
  const n=r.commonAncestorContainer;const ed=(n.nodeType===1?n:n.parentElement)?.closest?.('.ed');
  if(ed){S.range=r.cloneRange();S.focusEd=ed;updateFmtState()}
});
function restoreRange(){
  if(!S.focusEd||!document.contains(S.focusEd))return false;
  S.focusEd.focus({preventScroll:true});
  if(S.range){const s=getSelection();s.removeAllRanges();s.addRange(S.range)}
  return true;
}
function fmt(cmd,val,quiet){
  if(cmd!=='undo'&&cmd!=='redo'&&!restoreRange()){if(!quiet)toast('請先在文件中點一下');return false}
  if(cmd==='undo'||cmd==='redo')restoreRange();
  const ok=document.execCommand(cmd,false,val);
  S.focusEd&&S.focusEd.dispatchEvent(new Event('input'));
  updateFmtState();return ok;
}
function updateFmtState(){
  document.querySelectorAll('#fmtbar button[data-cmd]').forEach(b=>{const c=b.dataset.cmd;if(/^(bold|italic|underline|strikeThrough|justify\w+|insert\w+List)$/.test(c)){try{b.classList.toggle('on',document.queryCommandState(c))}catch(e){}}});
  try{const v=(document.queryCommandValue('formatBlock')||'p').toLowerCase().replace(/[<>]/g,'');const sel=$('#fStyle');if(sel)sel.value=['h2','h3','blockquote'].includes(v)?v:'p'}catch(e){}
  $('#fIndent')?.classList.toggle('on',!!prefs.indent);
}

/* ================= 主畫面 ================= */

function bindEditor(el,id){
  const it=item(id);
  el.className='ed';el.contentEditable='true';el.spellcheck=false;el.dataset.id=id;el.dataset.ph='開始寫作……';
  el.innerHTML=it.content||'<p><br></p>';
  const blank=()=>el.classList.toggle('blank',!el.innerText.trim()&&!el.querySelector('li,hr,.sep'));blank();
  el.addEventListener('input',()=>{const x=item(id);if(!x)return;x.content=el.innerHTML;x.wc=wc(el.innerText);x.modified=Date.now();blank();save();renderFooter();updateInspStats();updateTargets();
    document.querySelectorAll(`.ed[data-id="${id}"]`).forEach(o=>{if(o!==el)o.innerHTML=x.content});
    if(el.closest('#comp'))updateCompInfo()});
  el.addEventListener('focus',()=>{S.focusEd=el;if(S.insp!==id&&!el.closest('#comp'))setInsp(id)});
  el.addEventListener('paste',e=>{
    e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');if(!t)return;
    const lines=t.replace(/\r/g,'').split('\n');
    if(lines.length===1)document.execCommand('insertText',false,t);
    else document.execCommand('insertHTML',false,lines.map(l=>l.trim()?`<p>${esc(l)}</p>`:'').join(''));
  });
  el.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'　　')}});
}
function renderEditor(v,it,inSplit){
  const paper=document.createElement('div');paper.className='paper';v.appendChild(paper);
  if(it.type==='doc'){
    const ti=document.createElement('input');ti.className='dtitle';ti.value=it.title;ti.placeholder='標題';
    ti.oninput=()=>{it.title=ti.value;touch(it);renderBinder();if(!inSplit&&$('#path b'))$('#path b').textContent=ti.value;const f=$('#iTitle');if(f&&S.insp===it.id)f.value=ti.value};
    paper.appendChild(ti);
    const ed=document.createElement('div');paper.appendChild(ed);bindEditor(ed,it.id);
    if(it.children.length){const n=document.createElement('div');n.className='empty';n.style.padding='20px';n.textContent=`此文件底下還有 ${it.children.length} 個子文件，可切換至「軟木板」檢視。`;paper.appendChild(n)}
    if(!inSplit&&!it.wc)setTimeout(()=>{ed.focus()},50);
    return;
  }
  const list=descendants(it.id);
  if(!list.some(d=>item(d.id).type==='doc')){paper.innerHTML=`<div class="empty">「${esc(it.title)}」裡還沒有文件。<br><button class="primary">＋ 新增第一個文件</button></div>`;paper.querySelector('button').onclick=()=>addItem('doc',it.id);return}
  const h=document.createElement('div');h.className='folderhead';h.style.marginTop='0';h.textContent=it.title;paper.appendChild(h);
  list.forEach(({id})=>{const x=item(id);
    if(x.type==='folder'){const fh=document.createElement('div');fh.className='folderhead';fh.textContent=x.title;paper.appendChild(fh);return}
    const box=document.createElement('div');box.className='scriv';box.dataset.id=id;
    box.innerHTML=`<div class="stitle" title="單獨開啟">${iconFor(x)} ${esc(x.title)}${x.compile?'':'（不輸出）'}</div>`;
    box.querySelector('.stitle').onclick=()=>select(id);
    const ed=document.createElement('div');box.appendChild(ed);paper.appendChild(box);bindEditor(ed,id);ed.dataset.ph='（空白場景）';
  });
}
function openSplit(id){S.split=id;if(item(id).type==='doc'&&S.view!=='editor'){}renderMain()}
function renderSplit(b){
  const it=item(S.split);
  const h=document.createElement('div');h.className='splithead';
  h.innerHTML=`<span>分割視窗</span><b>${iconFor(it)} ${esc(it.title)}</b><button id="spSel" title="改成顯示目前檢視器中的項目">⇦ 換成目前項目</button><button id="spMain" title="在主視窗開啟">⤢</button><button id="spClose" title="關閉分割">✕</button>`;

function corkContainer(it){return it.type==='folder'||it.children.length?it.id:parentOf(it.id)}

/* ---------- 軟木板 ---------- */
function renderCork(v,it){
  const cid=corkContainer(it),c=item(cid);const free=!!c.corkFree;
  const tools=$('#viewTools');
  tools.innerHTML=`<div class="seg"><button data-m="grid" class="${free?'':'on'}">格狀</button><button data-m="free" class="${free?'on':''}">自由</button></div>
    ${free?'<button id="ckOrder" title="依卡片在板上的位置（由上而下、由左而右）重新排列文件順序">依位置排序</button><button id="ckTidy" title="把卡片排回整齊的格子">整理</button><button id="ckAdd">＋ 卡片</button>':''}
    <button id="ckBg" title="切換背景">${prefs.plainCork?'軟木':'素色'}</button>`;
  tools.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{c.corkFree=b.dataset.m==='free';touch(c);renderMain()});
  tools.querySelector('#ckBg').onclick=()=>{prefs.plainCork=!prefs.plainCork;savePrefs();renderMain()};
  const board=document.createElement('div');board.className='cork'+(free?' free':'')+(prefs.plainCork?' plain':'');v.appendChild(board);
  if(free){
    tools.querySelector('#ckOrder').onclick=()=>{c.children.sort((a,b)=>{const A=item(a),B=item(b);const ra=Math.round((A.fy||0)/120),rb=Math.round((B.fy||0)/120);return ra-rb||(A.fx||0)-(B.fx||0)});touch(c);renderAll();toast('已依卡片位置重新排序')};
    tools.querySelector('#ckTidy').onclick=()=>{c.children.forEach((id,i)=>{const x=item(id);x.fx=24+(i%4)*260;x.fy=24+Math.floor(i/4)*200});touch(c);renderMain()};
    tools.querySelector('#ckAdd').onclick=()=>{const n=addItem('doc',cid,{stay:true});const sv=v.scrollLeft,st=v.scrollTop;n.fx=sv+40;n.fy=st+40;renderMain();setInsp(n.id);document.querySelector(`.card[data-id="${n.id}"] textarea`)?.focus()};
  }
  let z=1;
  c.children.forEach((id,i)=>{const x=item(id);const card=cardEl(id);
    if(free){if(x.fx==null||x.fy==null){x.fx=24+(i%4)*260;x.fy=24+Math.floor(i/4)*200}
      card.style.left=x.fx+'px';card.style.top=x.fy+'px';
      card.addEventListener('pointerdown',e=>{
        if(e.button!==0||e.target.tagName==='TEXTAREA')return;
        const sx=e.clientX,sy=e.clientY,ox=x.fx,oy=x.fy;let moved=false;card.style.zIndex=++z;
        card.setPointerCapture(e.pointerId);
        const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.abs(dx)+Math.abs(dy)<4)return;moved=true;card.classList.add('dragging');x.fx=Math.max(0,ox+dx);x.fy=Math.max(0,oy+dy);card.style.left=x.fx+'px';card.style.top=x.fy+'px'};
        const up=()=>{card.removeEventListener('pointermove',mv);card.removeEventListener('pointerup',up);card.classList.remove('dragging');if(moved){x.fx=Math.round(x.fx);x.fy=Math.round(x.fy);touch(x);sizeBoard(board)}};
        card.addEventListener('pointermove',mv);card.addEventListener('pointerup',up);
      });
    }else{
      card.draggable=true;
      card.ondragstart=e=>{S.cardDrag=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id)};
      card.ondragend=()=>{S.cardDrag=null;board.querySelectorAll('.card').forEach(k=>k.classList.remove('drop-l','drop-r'))};
      card.ondragover=e=>{if(!S.cardDrag||S.cardDrag===id)return;e.preventDefault();const r=card.getBoundingClientRect();const left=e.clientX<r.left+r.width/2;card.classList.toggle('drop-l',left);card.classList.toggle('drop-r',!left);card.dataset.zone=left?'before':'after'};
      card.ondragleave=()=>card.classList.remove('drop-l','drop-r');
      card.ondrop=e=>{e.preventDefault();const zn=card.dataset.zone;if(S.cardDrag&&zn){const d=S.cardDrag;S.cardDrag=null;moveItem(d,id,zn)}};
    }
    board.appendChild(card);
  });
  if(!free){
    const add=document.createElement('div');add.className='card add';add.textContent='＋ 新增卡片';
    add.onclick=()=>{const n=addItem('doc',cid,{stay:true});setInsp(n.id);document.querySelector(`.card[data-id="${n.id}"] textarea`)?.focus()};
    board.appendChild(add);
  }else requestAnimationFrame(()=>sizeBoard(board));
}
function sizeBoard(board){let mx=0,my=0;board.querySelectorAll('.card').forEach(c=>{mx=Math.max(mx,c.offsetLeft+c.offsetWidth);my=Math.max(my,c.offsetTop+c.offsetHeight)});
  board.style.width=Math.max(mx+60,board.parentElement.clientWidth)+'px';board.style.height=Math.max(my+80,board.parentElement.clientHeight)+'px'}

function renderStory(v,it){
  const cid=corkContainer(it);
  const dateFields=P.fields.filter(f=>f.type==='date');
  if(prefs.stSort&&!dateFields.find(f=>f.id===prefs.stSort))prefs.stSort='';

  $('#stGroup').value=prefs.stGroup;$('#stSort').value=prefs.stSort;
  $('#stGroup').onchange=e=>{prefs.stGroup=e.target.value;savePrefs();renderMain()};

  const sf=prefs.stSort;

  if(!docs.length){v.innerHTML='<div class="empty">這裡沒有文件。<br>故事線會把資料夾內的場景依關鍵字或標籤排在不同顏色的線上。</div>';return}
  let rows;

  }

  wrap.style.width=(L+docs.length*CW+40)+'px';wrap.style.height=(TOP+rows.length*RH+30)+'px';wrap.style.minWidth='100%';wrap.style.minHeight='100%';
  docs.forEach((id,c)=>{const ax=document.createElement('div');ax.className='axis';ax.style.left=(L+c*CW)+'px';ax.textContent=sf?(item(id).meta[sf]||'（未填日期）'):`#${c+1}`;wrap.appendChild(ax);
    const vl=document.createElement('div');vl.className='vline';vl.style.left=(L+c*CW+CW/2)+'px';vl.style.height=(rows.length*RH)+'px';wrap.appendChild(vl)});
  rows.forEach((row,r)=>{
    const y=TOP+r*RH;
    const lab=document.createElement('div');lab.className='rowlab';lab.style.top=y+'px';lab.style.height=RH+'px';lab.innerHTML=`<i style="background:${row.color}"></i>${esc(row.name)}`;wrap.appendChild(lab);
    const ln=document.createElement('div');ln.className='line';ln.style.cssText=`top:${y+RH/2-2}px;left:${L-6}px;width:${docs.length*CW+12}px;background:${row.color}`;wrap.appendChild(ln);
    docs.forEach((id,c)=>{if(!row.has(item(id)))return;const card=cardEl(id);card.style.left=(L+c*CW+13)+'px';card.style.top=(y+20)+'px';wrap.appendChild(card)});
  });
  v.appendChild(wrap);
  if(prefs.stGroup==='kw'&&!P.keywords.length){const n=document.createElement('div');n.className='hint';n.style.cssText='position:sticky;left:0;bottom:0;padding:10px 14px;background:var(--panel)';n.textContent='提示：在右側檢視器替場景加上關鍵字（例如角色名、支線名稱），這裡就會為每個關鍵字畫一條故事線。';v.appendChild(n)}
}

function takeSnapshot(id,name){
  const it=item(id);if(it.type!=='doc')return toast('只有文件可以拍攝快照');
  const doIt=n=>{it.snapshots.push({t:Date.now(),name:n||'',content:it.content,title:it.title});touch(it);if((S.insp||S.sel)===id)renderInspector();toast('📷 已建立快照')};
  if(name!==undefined)return doIt(name);
  promptBox('拍攝快照','快照名稱（可留空）','',doIt);
}
function viewSnapshot(id,s){
  modal(`快照：${s.name||fmtDate(s.t)}`,`<div class="hint" style="margin-bottom:8px">${fmtDate(s.t)}・${wc(plain(s.content))} 字（目前 ${item(id).wc} 字）</div><div class="snapview"><div class="ed">${sanitize(s.content)||'（空白）'}</div></div>`,
    [['關閉'],['複製文字',()=>{navigator.clipboard?.writeText(plain(s.content));toast('已複製')}],['還原此版本',()=>restoreSnapshot(id,s,true),'primary']]);
}
function restoreSnapshot(id,s,skip){
  const go=()=>{const it=item(id);it.snapshots.push({t:Date.now(),name:'還原前自動備份',content:it.content,title:it.title});setContent(it,s.content);touch(it);renderAll();toast('已還原（還原前的內容已自動存成快照）')};
  if(skip)return go();
  confirmBox('還原快照','用這個快照取代目前內容？目前的內容會自動另存成快照。',go);
}

/* ================= 輸出成稿 ================= */
function headingFor(it,depth,opt,counter){
  const t=it.section||(it.type==='folder'?'chapter':'scene');
  if(t==='none')return null;
  if(t==='front')return {lvl:Math.min(depth,3),text:it.title};
  if(t==='chapter'){if(!opt.chapters)return null;counter.ch++;return {lvl:Math.min(depth,3),text:opt.number?`第${cnNum(counter.ch)}章　${it.title}`:it.title}}
  return opt.scenes?{lvl:Math.min(depth,4),text:it.title}:null;
}
function compileProject(opt){
  const out=[];const counter={ch:0};
  function walkChildren(pid,depth){let prevDoc=false;
    item(pid).children.forEach(c=>{const x=item(c);if(!x.compile)return;
      if(prevDoc&&x.type==='doc'&&opt.sep&&!headingFor(x,depth,opt,{ch:0}))out.push({k:'sep'});
      walk(c,depth);prevDoc=x.type==='doc'})}
  function walk(id,depth){const it=item(id);
    const h=headingFor(it,depth,opt,counter);if(h)out.push({k:'h',lvl:h.lvl,t:h.text});
    if(opt.synopsis&&it.synopsis)out.push({k:'syn',t:it.synopsis});
    if(it.type==='doc'){const bl=htmlBlocks(it.content);if(bl.length)out.push({k:'body',blocks:bl})}
    walkChildren(id,depth+1)}
  walkChildren(P.roots[0],1);
  const title=P.title,author=opt.author;
  if(opt.fmt==='txt'){
    const pj=opt.indent?'\n':'\n\n';
    let s=title+'\n'+(author?author+'\n':'')+'\n';
    out.forEach(b=>{
      if(b.k==='h')s+=(b.lvl===1?'\n\n':'\n')+b.t+'\n\n';
      else if(b.k==='sep')s+='\n　　　　＊　＊　＊\n\n';
      else if(b.k==='syn')s+='〔'+b.t+'〕\n\n';
      else s+=b.blocks.map(x=>{if(x.tag==='sep')return '\n　　　　＊　＊　＊\n';if(x.tag==='ul')return '・'+x.text;if(x.tag==='ol')return x.n+'. '+x.text;if(x.tag==='h')return '\n'+x.text+'\n';
        if(x.tag==='quote')return '　　　　'+x.text.replace(/\n/g,'\n　　　　');return x.text.split('\n').map(l=>(opt.indent&&!x.align?'　　':'')+l.trim()).join(pj)}).join(pj)+'\n\n';
    });
    return s.replace(/\n{4,}/g,'\n\n\n');
  }
  if(opt.fmt==='md'){
    let s='# '+title+'\n\n'+(author?'*'+author+'*\n\n':'');
    out.forEach(b=>{
      if(b.k==='h')s+='#'.repeat(Math.min(6,b.lvl+1))+' '+b.t+'\n\n';
      else if(b.k==='sep')s+='* * *\n\n';
      else if(b.k==='syn')s+='> '+b.t.replace(/\n/g,'\n> ')+'\n\n';
      else s+=b.blocks.map(x=>{const t=inlineMD(x.inner).trim();if(x.tag==='sep')return '* * *';if(x.tag==='ul')return '- '+t;if(x.tag==='ol')return x.n+'. '+t;if(x.tag==='h')return '#### '+t;if(x.tag==='quote')return '> '+t.replace(/\n/g,'\n> ');return t}).join('\n\n')+'\n\n';
    });
    return s.replace(/(^- .*|^\d+\. .*)\n\n(?=- |\d+\. )/gm,'$1\n');
  }
  let body='';
  out.forEach(b=>{
    if(b.k==='h'){const n=Math.min(6,b.lvl+1);body+=`<h${n}>${esc(b.t)}</h${n}>\n`}
    else if(b.k==='sep')body+='<p class="sep">＊　＊　＊</p>\n';
    else if(b.k==='syn')body+=`<blockquote class="syn">${esc(b.t)}</blockquote>\n`;
    else{let open='';
      b.blocks.forEach(x=>{const lt=x.tag==='ul'||x.tag==='ol'?x.tag:'';
        if(open&&open!==lt){body+=`</${open}>\n`;open=''}
        if(lt&&!open){body+=`<${lt}>`;open=lt}
        const inner=sanitize(x.inner);
        if(lt)body+=`<li>${inner}</li>`;
        else if(x.tag==='sep')body+='<p class="sep">＊　＊　＊</p>\n';
        else if(x.tag==='h')body+=`<h4>${inner}</h4>\n`;
        else if(x.tag==='quote')body+=`<blockquote>${inner}</blockquote>\n`;
        else body+=`<p${x.align?` style="text-align:${esc(x.align)};text-indent:0"`:''}>${inner}</p>\n`});
      if(open)body+=`</${open}>\n`}
  });
  return `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>${esc(title)}</title><style>
body{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;max-width:680px;margin:60px auto;padding:0 24px;line-height:2;font-size:18px;color:#222}
h1{text-align:center;font-size:2em;margin-bottom:.2em}.author{text-align:center;color:#666;margin-bottom:4em}
h2{margin-top:3em;page-break-before:always;text-align:center}h3{margin-top:2em}h4{margin-top:1.5em}
p{margin:0 0 ${opt.indent?'.2em':'.9em'};${opt.indent?'text-indent:2em;':''}}
.sep{text-align:center;text-indent:0;margin:1.5em 0;color:#888}blockquote{color:#555;margin:1em 2em;font-size:.95em}blockquote.syn{color:#888;border-left:3px solid #ccc;padding-left:1em;margin-left:0}
@media print{body{margin:0 auto}h2:first-of-type{page-break-before:avoid}}</style></head><body>
<h1>${esc(title)}</h1>${author?`<div class="author">${esc(author)}</div>`:''}
${body}</body></html>`;
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function openCompile(){
  const o=Object.assign({fmt:'txt',chapters:true,number:false,scenes:false,sep:true,synopsis:false,indent:true,author:''},P.compileOpt||{});
  modal('輸出成稿',`
    <div class="field"><label>格式</label><select id="cFmt" style="width:100%"><option value="txt">純文字 (.txt)</option><option value="md">Markdown (.md)</option><option value="html">網頁 (.html)</option><option value="print">列印／另存 PDF</option></select></div>
    <div class="field"><label>作者署名</label><input id="cAuthor" style="width:100%" placeholder="（可留空）"></div>
    <label class="chk"><input type="checkbox" id="cCh"> 顯示章標題（資料夾或段落類型為「章」）</label>
    <label class="chk"><input type="checkbox" id="cNum"> 章節自動編號（第一章、第二章……）</label>
    <label class="chk"><input type="checkbox" id="cSc"> 顯示場景標題</label>
    <label class="chk"><input type="checkbox" id="cSep"> 場景之間加分隔符（＊　＊　＊）</label>
    <label class="chk"><input type="checkbox" id="cIn"> 段首空兩格</label>
    <label class="chk"><input type="checkbox" id="cSyn"> 附上概要（適合交給編輯看大綱）</label>
    <p class="hint" style="margin:12px 0 0">只輸出「草稿」資料夾內勾選「納入輸出」的項目，約 ${totalWords(P.roots[0],true).toLocaleString()} 字。可在檢視器的「段落類型」個別指定章、場景、前言或不加標題。</p>`,
    [['取消'],['預覽',()=>{const opt=readOpt();modal('預覽（純文字）',`<pre>${esc(compileProject({...opt,fmt:'txt'}))}</pre>`,[['返回',()=>{openCompile();return false}],['關閉']]);return false}],['輸出',()=>{
      const opt=readOpt();P.compileOpt=opt;save();
      if(opt.fmt==='print'){const html=compileProject({...opt,fmt:'html'});const w=window.open(URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})));if(!w)toast('請允許彈出視窗');else w.addEventListener('load',()=>setTimeout(()=>w.print(),300));return}
      const ext=opt.fmt;download(safeName(P.title)+'.'+ext,compileProject(opt),{txt:'text/plain',md:'text/markdown',html:'text/html'}[ext]);toast('已輸出 '+ext.toUpperCase());
    },'primary']]);
  $('#cFmt').value=o.fmt;$('#cAuthor').value=o.author||'';$('#cCh').checked=o.chapters;$('#cNum').checked=o.number;$('#cSc').checked=o.scenes;$('#cSep').checked=o.sep;$('#cIn').checked=o.indent;$('#cSyn').checked=o.synopsis;
  function readOpt(){const r={fmt:$('#cFmt').value,author:$('#cAuthor').value.trim(),chapters:$('#cCh').checked,number:$('#cNum').checked,scenes:$('#cSc').checked,sep:$('#cSep').checked,indent:$('#cIn').checked,synopsis:$('#cSyn').checked};P.compileOpt=r;return r}
}

/* ================= 專案檔 ================= */
function openFileMenu(){
  modal('專案',`<p style="margin-top:0">資料自動儲存在這台電腦的瀏覽器中。換電腦或清除瀏覽資料前，請先匯出專案檔。</p>
    <div style="display:grid;gap:8px;grid-template-columns:1fr 1fr">
      <button id="fExp">⬇ 匯出專案檔 (.json)</button>
      <button id="fImp">⬆ 匯入專案檔</button>
      <button id="fKw">🏷 管理關鍵字</button>
      <button id="fFld">⚙ 管理自訂欄位</button>
      <button id="fNew">＋ 建立空白新專案</button>
      <button id="fSample">↺ 載入範例專案</button>
    </div>
    <p class="hint" style="margin-bottom:0">快捷鍵：<kbd>Ctrl/⌘ S</kbd> 儲存　<kbd>Ctrl/⌘ 1~4</kbd> 切換檢視　<kbd>Ctrl/⌘ B/I/U</kbd> 格式　<kbd>F9</kbd> 專注　<kbd>Alt ←/→</kbd> 上一個／下一個　<kbd>Esc</kbd> 離開</p>`,[['關閉']]);
  $('#fExp').onclick=exportProject;
  $('#fImp').onclick=()=>$('#fileIn').click();
  $('#fKw').onclick=manageKeywords;
  $('#fFld').onclick=manageFields;
  $('#fNew').onclick=()=>confirmBox('建立新專案','目前專案將被取代（建議先匯出備份）。繼續嗎？',()=>{const {p,add,d}=baseProject('未命名專案');const c=add(mk('folder','第一章',{section:'chapter'}));d.children.push(c.id);const s=add(mk('doc','第一個場景'));c.children.push(s.id);P=p;resetAfterLoad(s.id)});
  $('#fSample').onclick=()=>confirmBox('載入範例','目前專案將被範例取代（建議先匯出備份）。繼續嗎？',()=>{P=sampleProject();const f=P.firstSel;delete P.firstSel;resetAfterLoad(f)});
}
function resetAfterLoad(first){S.expanded=P.expanded||{};S.view='editor';S.split=null;S.tab='binder';S.hist=[];S.hpos=-1;S.sel=null;resetSession();select(first);saveNow()}
function exportProject(){saveNow();const d=new Date();download(`${safeName(P.title)}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.inkbox.json`,JSON.stringify(P,null,1),'application/json');toast('已匯出專案檔')}
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const np=JSON.parse(r.result);if(!np.items||!np.roots)throw 0;
    confirmBox('匯入專案',`匯入「${esc(np.title)}」將取代目前專案，確定嗎？`,()=>{P=migrate(np);resetAfterLoad(P.lastSel&&item(P.lastSel)?P.lastSel:P.roots[0]);toast('匯入完成')})}
    catch(err){toast('檔案格式不正確')}};
  r.readAsText(f);e.target.value=''};

/* ================= 對話框工具 ================= */
let modalSeq=0;
function modal(title,html,buttons){
  const seq=++modalSeq;
  $('#mTitle').textContent=title;$('#mBody').innerHTML=html;const f=$('#mFoot');f.innerHTML='';
  (buttons||[['確定']]).forEach(([label,fn,cls])=>{const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;
    b.onclick=()=>{let keep=false;if(fn)keep=fn()===false;if(!keep&&seq===modalSeq)closeModal()};f.appendChild(b)});
  $('#modalBg').classList.add('show');
  setTimeout(()=>{const i=$('#mBody input:not([type=checkbox]):not([type=color]),#mBody select');i&&i.focus()},30);
}
function closeModal(){$('#modalBg').classList.remove('show')}
$('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};
function confirmBox(title,msg,ok){modal(title,`<p style="margin:0">${msg}</p>`,[['取消'],['確定',()=>{closeModal();ok()},'primary']])}
function promptBox(title,label,val,ok){
  modal(title,`<div class="field"><label>${esc(label)}</label><input id="pIn" style="width:100%"></div>`,[['取消'],['確定',()=>{const v=$('#pIn').value;closeModal();ok(v)},'primary']]);
  const i=$('#pIn');i.value=val;i.onkeydown=e=>{if(e.key==='Enter'){const v=i.value;closeModal();ok(v)}};
}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ================= 事件綁定 ================= */
$('#projTitle').oninput=e=>{P.title=e.target.value;document.title=P.title+' · 墨匣';save();updateTargets()};
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;renderMain()});
$('#addDoc').onclick=()=>addItem('doc');
$('#addFolder').onclick=()=>addItem('folder');
$('#delItem').onclick=()=>trashItem();
$('#search').oninput=e=>{S.search=e.target.value;if(S.search.trim())S.tab='search';else if(S.tab==='search')S.tab='binder';renderBinder()};
$('#navBack').onclick=()=>nav(-1);
$('#navFwd').onclick=()=>nav(1);
$('#btnSplit').onclick=toggleSplit;
$('#btnComp').onclick=openComp;
$('#btnCompile').onclick=openCompile;
$('#btnTargets').onclick=toggleTargets;
$('#btnFile').onclick=openFileMenu;
$('#btnTheme').onclick=()=>{prefs.theme={light:'sepia',sepia:'dark',dark:'light'}[prefs.theme];applyPrefs();savePrefs()};
$('#btnBinder').onclick=()=>{if(innerWidth<=640)document.body.classList.toggle('show-binder');else{prefs.binder=!prefs.binder;applyPrefs();savePrefs()}};
$('#btnInsp').onclick=()=>{if(innerWidth<=900)document.body.classList.toggle('show-insp');else{prefs.insp=!prefs.insp;applyPrefs();savePrefs()}};
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(e.key==='Escape'){if($('#modalBg').classList.contains('show'))closeModal();else if(compId)closeComp();hideMenu();return}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow();toast('已儲存');return}
  if(mod&&['1','2','3','4'].includes(e.key)){e.preventDefault();S.view=['editor','cork','outline','story'][+e.key-1];renderMain();return}
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();nav(-1);return}
  if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();nav(1);return}
  if(e.key==='F9'){e.preventDefault();compId?closeComp():openComp();return}
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&compId)closeComp()});
addEventListener('beforeunload',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});

/* ================= 啟動 ================= */
try{document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
load();applyPrefs();buildFmtbar();document.title=P.title+' · 墨匣';renderAll();updateFmtState();saveNow();
</script>
</body>
</html>
